<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity Tracker</title>
<link rel="icon" href="/favicon.ico">
<style>
/* Manrope (SIL Open Font License), embedded in the exe: works offline. */
@font-face { font-family: "Manrope"; font-style: normal; font-weight: 200 800; font-display: swap;
  src: url(/fonts/manrope-latin.woff2) format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Manrope"; font-style: normal; font-weight: 200 800; font-display: swap;
  src: url(/fonts/manrope-latin-ext.woff2) format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
:root {
  color-scheme: dark;
  --bg: #000; --card: #1c1c1e; --card-2: #2c2c2e; --fill: rgba(255,255,255,.07); --line: rgba(255,255,255,.08);
  --text: #f5f5f7; --text-2: #a1a1a6; --muted: #6e6e73;
  --accent: #0a84ff; --good: #30d158; --warn: #ff9f0a;
  --font: "Manrope", "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(.22, 1, .36, 1); --spring: cubic-bezier(.34, 1.56, .64, 1);
}
* { box-sizing: border-box; }
html { background: var(--bg); scrollbar-color: #3a3a3c transparent; }
body { margin: 0; color: var(--text); font: 15px/1.5 var(--font); font-feature-settings: "tnum" 0; -webkit-font-smoothing: antialiased; min-height: 100vh; background: var(--bg); }
a { color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

/* Header: translucent, sticky, segmented control */
header { position: sticky; top: 0; z-index: 5; background: rgba(0,0,0,.72); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid transparent; transition: border-color .3s; }
header.scrolled { border-bottom-color: var(--line); }
header .wrap { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 20px; height: 64px; }
.brand { display: flex; align-items: center; gap: 11px; text-decoration: none; white-space: nowrap; }
.brand b { font-size: 16px; font-weight: 700; letter-spacing: -.02em; }
.brand small { color: var(--muted); font-size: 12.5px; font-weight: 500; }
.logo { width: 30px; height: 30px; flex: none; overflow: visible; }
.logo .lg-arc { animation: draw 1.4s var(--ease) .1s both; }
.logo .lg-m, .logo .lg-h { transform-box: view-box; transform-origin: 32px 32px; }
.logo .lg-m { animation: spin-in 1.5s var(--ease) both; }
.logo .lg-h { animation: hour-in 1.5s var(--ease) both; }
.brand:hover .lg-m { animation: spin-hover 1s var(--ease); }
@keyframes draw { from { stroke-dasharray: 0 360; } to { stroke-dasharray: 290 360; } }
@keyframes spin-in { from { transform: rotate(-420deg); } }
@keyframes hour-in { from { transform: rotate(-120deg); } }
@keyframes spin-hover { from { transform: rotate(-360deg); } }
nav { position: relative; display: flex; justify-self: center; min-width: 0; padding: 3px; border-radius: 999px; background: var(--card); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav a { position: relative; z-index: 1; color: var(--text-2); text-decoration: none; padding: 6px 15px; border-radius: 999px; font-size: 13.5px; font-weight: 600; white-space: nowrap; transition: color .3s var(--ease); }
nav a:hover { color: var(--text); }
nav a.on { color: var(--text); }
nav .pill { position: absolute; top: 3px; bottom: 3px; left: 0; width: 0; border-radius: 999px; background: #3a3a3c;
  box-shadow: 0 1px 3px rgba(0,0,0,.4); transition: transform .5s var(--ease), width .5s var(--ease); }
.head-right { justify-self: end; color: var(--muted); font-size: 13px; font-weight: 500; white-space: nowrap; }
@media (max-width: 1100px) { .brand small { display: none; } }
@media (max-width: 860px) {
  header .wrap { grid-template-columns: minmax(0, 1fr); height: auto; padding-top: 12px; padding-bottom: 12px; gap: 10px; }
  nav { justify-self: stretch; } .head-right { display: none; }
}

main { padding-top: 56px; padding-bottom: 64px; }
h1.title { font-size: clamp(34px, 5.4vw, 52px); font-weight: 700; letter-spacing: -.04em; line-height: 1.04; margin: 0 0 8px; }
.lead { color: var(--text-2); margin: 0 0 36px; font-size: 17px; font-weight: 500; letter-spacing: -.01em; }
h2 { font-size: 19px; font-weight: 700; letter-spacing: -.025em; margin: 0 0 4px; }
.hint-line { color: var(--muted); font-size: 13.5px; margin: 0 0 18px; }
.card { background: var(--card); border-radius: 22px; padding: 26px; }
.label { color: var(--text-2); font-size: 13.5px; font-weight: 600; }
.row { display: grid; gap: 14px; margin-bottom: 14px; }
.row > * { min-width: 0; }
.tile .v { overflow-wrap: anywhere; }
.c2 { grid-template-columns: 1.5fr 1fr; } .c3 { grid-template-columns: repeat(3, 1fr); } .c4 { grid-template-columns: repeat(4, 1fr); }
.c2b { grid-template-columns: 1fr 1fr; }
@media (max-width: 860px) { .c2, .c2b, .c3 { grid-template-columns: 1fr; } .c4 { grid-template-columns: 1fr 1fr; } }
section.block { margin-top: 52px; }
.big { font-size: clamp(52px, 8vw, 76px); font-weight: 700; letter-spacing: -.05em; line-height: 1; margin: 14px 0 18px; font-variant-numeric: tabular-nums; }
.big small { font-size: .36em; color: var(--text-2); font-weight: 600; letter-spacing: -.01em; margin: 0 8px 0 3px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--text-2); background: var(--fill); }
.sub { color: var(--text-2); font-size: 14px; margin-top: 14px; }
.sub b { color: var(--text); font-weight: 700; }
.goal { display: flex; align-items: center; gap: 24px; }
.goal svg { flex: none; }
.goal .v { font-size: 28px; font-weight: 700; letter-spacing: -.03em; margin-top: 2px; }
.ring-arc { transition: stroke-dasharray 1.6s var(--ease) .25s; }
.ring text { font-family: var(--font); }
.tile .v { font-size: 30px; font-weight: 700; letter-spacing: -.04em; margin: 10px 0 4px; font-variant-numeric: tabular-nums; }
.tile .hint { color: var(--muted); font-size: 13px; font-weight: 500; }
.tile .hint.warn { color: var(--warn); } .tile .hint.ok { color: var(--good); }

/* Charts */
.strip { position: relative; height: 34px; border-radius: 10px; background: var(--card-2); overflow: hidden; margin: 16px 0 6px; }
.strip i { position: absolute; top: 0; bottom: 0; border-right: 1.5px solid var(--card); min-width: 2px; transition: filter .2s; }
.strip i:hover { filter: brightness(1.25); }
.ticks { position: relative; height: 18px; color: var(--muted); font-size: 11.5px; font-weight: 600; margin-bottom: 14px; }
.ticks span { position: absolute; transform: translateX(-50%); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--text-2); font-size: 13px; font-weight: 500; margin-bottom: 30px; }
.legend b { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; }
.bars { display: flex; align-items: flex-end; gap: 5px; height: 170px; position: relative; margin-top: 18px; }
.bars .b { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; min-width: 0; }
.bars .b i { display: block; width: 100%; max-width: 30px; border-radius: 6px 6px 3px 3px; background: #e5e5ea; min-height: 3px; transform-origin: bottom; transition: background .25s, opacity .25s; }
.bars .b.zero i { background: var(--card-2); }
.bars .b.now i { background: var(--accent); }
.bars .b.over i { background: var(--warn); }
.bars:hover .b i { opacity: .45; }
.bars .b:hover i { opacity: 1; }
.bars.goal { padding-right: 58px; }
.bars .goal-line { position: absolute; left: 0; right: 0; border-top: 1px dashed rgba(255,159,10,.55); pointer-events: none; }
.bars .goal-line span { position: absolute; right: 0; top: -9px; font-size: 11px; font-weight: 600; line-height: 16px; color: var(--warn); background: var(--card); padding-left: 8px; }
.xl.goal { padding-right: 58px; }
.xl { display: flex; gap: 5px; margin-top: 10px; color: var(--muted); font-size: 11.5px; font-weight: 600; }
.xl span { flex: 1; text-align: center; min-width: 0; white-space: nowrap; }

/* Lists */
.list { display: flex; flex-direction: column; margin: 0 -10px; }
.item { display: grid; grid-template-columns: 36px 1fr auto; gap: 14px; align-items: center; padding: 11px 10px; border-radius: 14px; transition: background .25s; }
.item:hover { background: var(--fill); }
.item .name { font-weight: 600; display: flex; justify-content: space-between; gap: 10px; letter-spacing: -.01em; }
.item .name em { font-style: normal; color: var(--muted); font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track { height: 5px; background: var(--card-2); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 3px; background: #e5e5ea; transform-origin: left; }
.track.limit i { background: var(--accent); } .track.limit.over i { background: var(--warn); }
.item .t { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 80px; letter-spacing: -.01em; }
.item .t small { display: block; font-weight: 500; font-size: 12.5px; color: var(--muted); }
.avatar { position: relative; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 15px; }
.avatar img { position: absolute; width: 32px; height: 32px; }
.empty { color: var(--muted); text-align: center; padding: 32px 0; font-weight: 500; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 20px; border-radius: 999px; font: 600 14px var(--font); cursor: pointer; text-decoration: none;
  background: #f5f5f7; color: #000; border: 0; transition: transform .2s var(--ease), background .2s, opacity .2s; }
.btn:hover { background: #fff; }
.btn:active { transform: scale(.96); }
.btn.ghost { background: var(--fill); color: var(--text); }
.btn.ghost:hover { background: rgba(255,255,255,.12); }
.btn:disabled { opacity: .3; cursor: default; transform: none; }
.btn.small { padding: 7px 14px; font-size: 13px; }
#tip { position: fixed; pointer-events: none; background: rgba(44,44,46,.92); backdrop-filter: blur(12px); color: var(--text); font-size: 12.5px; font-weight: 600;
  padding: 7px 11px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.5); opacity: 0; transform: translateY(4px); z-index: 10; white-space: nowrap;
  transition: opacity .18s, transform .18s var(--ease); }
#tip.on { opacity: 1; transform: none; }

/* Year */
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; overflow-x: auto; padding-bottom: 4px; }
.heat i { width: 13px; height: 13px; border-radius: 4px; background: var(--card-2); transition: transform .2s var(--ease); }
.heat i:hover { transform: scale(1.35); }
.heat i.l1 { background: rgba(10,132,255,.3); } .heat i.l2 { background: rgba(10,132,255,.55); } .heat i.l3 { background: rgba(10,132,255,.8); } .heat i.l4 { background: #4aa3ff; }
.heat i.future { background: transparent; }
.months { display: grid; grid-auto-flow: column; gap: 3px; color: var(--muted); font-size: 11.5px; font-weight: 600; margin-bottom: 8px; overflow: hidden; }
.months span { width: 13px; white-space: nowrap; }
.scale { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; font-weight: 500; margin-top: 14px; justify-content: flex-end; }
.scale i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.streak .v { font-size: 46px; font-weight: 700; letter-spacing: -.05em; margin: 8px 0 0; }

/* Wrapped */
.w-nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
.w-nav b { font-weight: 700; letter-spacing: -.01em; }
.w-hero { position: relative; overflow: hidden; border-radius: 28px; padding: 56px 44px 52px; margin-bottom: 14px; background: var(--card); }
.w-hero .emoji { display: inline-block; font-size: 72px; line-height: 1; margin: 26px 0 18px; }
.w-hero .emoji span { display: inline-block; }
.w-hero h1 { font-size: clamp(44px, 7.5vw, 84px); font-weight: 800; letter-spacing: -.055em; line-height: .98; margin: 0; }
.w-hero h1 .w { display: inline-block; white-space: nowrap; }
.w-hero h1 .w span { display: inline-block; }
.w-hero p { font-size: 19px; font-weight: 500; color: var(--text-2); margin: 16px 0 0; max-width: 620px; letter-spacing: -.01em; }
.stat .v { font-size: 38px; font-weight: 700; letter-spacing: -.05em; margin: 10px 0 8px; }
.top1 { display: flex; align-items: center; gap: 16px; margin-top: 14px; }
.top1 .avatar { width: 60px; height: 60px; border-radius: 16px; font-size: 24px; }
.top1 .avatar img { width: 52px; height: 52px; }
.move { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.move .d { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }

/* Customization */
.edit { opacity: 0; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; padding: 2px 7px; border-radius: 8px; transition: opacity .2s, color .2s, background .2s; }
.item:hover .edit, .edit:focus-visible { opacity: 1; } .edit:hover { color: var(--text); background: var(--fill); }
@media (hover: none) { .edit { opacity: 1; } }
.name .nm { display: inline-flex; align-items: center; gap: 4px; min-width: 0; }
dialog { background: var(--card); color: var(--text); border: 0; border-radius: 24px; padding: 30px; width: min(450px, calc(100vw - 32px)); box-shadow: 0 30px 80px rgba(0,0,0,.6); }
dialog[open] { animation: sheet .45s var(--ease); }
dialog::backdrop { background: rgba(0,0,0,.55); backdrop-filter: blur(6px); animation: fade .35s ease; }
@keyframes sheet { from { opacity: 0; transform: translateY(14px) scale(.97); } }
@keyframes fade { from { opacity: 0; } }
dialog h2 { font-size: 22px; margin-bottom: 6px; }
dialog .preview { display: flex; align-items: center; gap: 18px; margin: 22px 0; }
dialog .preview .avatar { width: 68px; height: 68px; border-radius: 18px; font-size: 28px; }
dialog .preview .avatar img { width: 60px; height: 60px; }
dialog label { display: block; color: var(--text-2); font-size: 13.5px; font-weight: 600; margin: 4px 0 8px; }
dialog input[type=text] { width: 100%; background: var(--card-2); color: var(--text); border: 1px solid transparent; border-radius: 12px; padding: 11px 14px; font: 500 15px var(--font); transition: border-color .2s, box-shadow .2s; }
dialog input[type=text]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(10,132,255,.2); }
.linkbtn { background: none; border: 0; color: var(--accent); font: 600 13px var(--font); cursor: pointer; padding: 0; }
.linkbtn:hover { text-decoration: underline; }
.actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 26px; }
.err { color: #ff453a; font-size: 13px; font-weight: 500; min-height: 18px; margin-top: 8px; }
footer { margin-top: 64px; padding-top: 22px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; color: var(--muted); font-size: 13px; font-weight: 500; }
footer a { color: var(--text-2); text-decoration: none; } footer a:hover { color: var(--text); }

/* Motion: only when a view is opened (class .anim), never on the minute refresh. */
.anim .rv { animation: rise .8s var(--ease) both; animation-delay: calc(var(--i, 0) * 55ms); }
@keyframes rise { from { opacity: 0; transform: translateY(18px); filter: blur(6px); } }
.anim .bars .b i { animation: grow .9s var(--ease) both; animation-delay: calc(var(--j, 0) * 22ms + 250ms); }
@keyframes grow { from { transform: scaleY(0); } }
.anim .track i { animation: fill 1.1s var(--ease) both; animation-delay: calc(var(--j, 0) * 60ms + 300ms); }
@keyframes fill { from { transform: scaleX(0); } }
.anim .strip { animation: wipe 1.4s var(--ease) .3s both; }
@keyframes wipe { from { clip-path: inset(0 100% 0 0 round 10px); } to { clip-path: inset(0 0 0 0 round 10px); } }
.anim .heat i { animation: pop-in .5s var(--ease) both; animation-delay: calc(var(--c, 0) * 9ms + 200ms); }
@keyframes pop-in { from { opacity: 0; transform: scale(.4); } }
/* Wrapped persona: emoji pops in, then keeps a small personality; the title appears letter by letter. */
.anim .w-hero .emoji { animation: emoji-in .9s var(--spring) .25s both; }
@keyframes emoji-in { from { opacity: 0; transform: scale(.2) rotate(-25deg); } }
.anim .w-hero h1 .w span { animation: letter .7s var(--ease) both; animation-delay: calc(var(--k) * 32ms + 450ms); }
@keyframes letter { from { opacity: 0; transform: translateY(.45em) rotate(4deg); filter: blur(8px); } }
.anim .w-hero p { animation: rise .9s var(--ease) both; animation-delay: .95s; }
.p-marathon span { animation: run 1.1s ease-in-out infinite 1.2s; }
@keyframes run { 0%, 100% { transform: translate(0, 0) rotate(-3deg); } 25% { transform: translate(5px, -7px) rotate(2deg); } 50% { transform: translate(10px, 0) rotate(-2deg); } 75% { transform: translate(5px, -5px) rotate(3deg); } }
.p-night_owl span { animation: sway 3.2s ease-in-out infinite 1.2s; transform-origin: 50% 90%; }
@keyframes sway { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
.p-early_bird span { animation: rise-sun 3.6s ease-in-out infinite 1.2s; }
@keyframes rise-sun { 0%, 100% { transform: translateY(4px); } 50% { transform: translateY(-6px); } }
.p-zen span, .p-off span { animation: breathe 4s ease-in-out infinite 1.2s; }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.09); } }
.p-deep_focus span, .p-loyal span { animation: pulse 2.4s ease-in-out infinite 1.2s; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 12% { transform: scale(1.12); } 24% { transform: scale(1); } 36% { transform: scale(1.06); } 48% { transform: scale(1); } }
.p-balanced span { animation: tilt 3s ease-in-out infinite 1.2s; }
@keyframes tilt { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<header id="top"><div class="wrap">
  <a class="brand" href="#today">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <rect x="1" y="1" width="62" height="62" rx="15" fill="#1c1c1e" stroke="rgba(255,255,255,.16)"/>
      <circle cx="32" cy="32" r="19" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="5.5"/>
      <circle class="lg-arc" cx="32" cy="32" r="19" fill="none" stroke="#f5f5f7" stroke-width="5.5" stroke-linecap="round" pathLength="360" stroke-dasharray="290 360" transform="rotate(-90 32 32)"/>
      <g class="lg-h"><line x1="32" y1="32" x2="32" y2="21" stroke="#f5f5f7" stroke-width="4" stroke-linecap="round"/></g>
      <g class="lg-m"><line x1="32" y1="32" x2="40" y2="36.6" stroke="#4d7cff" stroke-width="4" stroke-linecap="round"/></g>
      <circle cx="32" cy="32" r="3.4" fill="#f5f5f7"/>
    </svg>
    <b>Activity Tracker</b><small>by Enzo Freminet</small></a>
  <nav id="nav"></nav>
  <div class="head-right" id="period"></div>
</div></header>
<main class="wrap">
  <div id="view"></div>
  <footer>
    <span id="foot-local"></span>
    <span><a href="/api/export.csv" download id="foot-export"></a> · <span id="foot-version"></span> · ef tools</span>
  </footer>
</main>
<div id="tip"></div>
<dialog id="editor">
  <form method="dialog" id="edit-form">
    <h2 id="ed-title"></h2><p class="hint-line" id="ed-hint" style="margin:0"></p>
    <div class="preview"><div id="ed-avatar"></div>
      <div><button type="button" class="btn ghost small" id="ed-pick"></button><br>
        <button type="button" class="linkbtn" id="ed-reset-logo" style="margin-top:10px"></button></div>
      <input type="file" id="ed-file" accept="image/*,.ico,.svg" hidden></div>
    <label for="ed-name" id="ed-name-label"></label><input type="text" id="ed-name" maxlength="60" autocomplete="off">
    <div style="margin-top:10px"><button type="button" class="linkbtn" id="ed-reset-name"></button></div>
    <div class="err" id="ed-err"></div>
    <div class="actions"><button type="button" class="btn ghost" id="ed-cancel"></button><button type="submit" class="btn" id="ed-save"></button></div>
  </form>
</dialog>

<script>
// ---------------------------------------------------------------- i18n
const I18N = {
  fr: {
    nav: { today: "Aujourd'hui", week: 'Semaine', month: 'Mois', year: 'Année', wrapped: 'Wrapped', apps: 'Applis' },
    edit: 'Personnaliser', editHint: "Le nom et le logo sont enregistrés sur ce PC et restent après une mise à jour. Donner le même nom à deux applis les regroupe.",

let T = I18N.en, CONF = {};

// ---------------------------------------------------------------- helpers
const PALETTE = ['#0a84ff', '#ff9f0a', '#30d158', '#bf5af2', '#ff375f', '#64d2ff', '#ffd60a', '#5e5ce6'];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(s) {
  s = Math.round(Math.abs(s || 0));
  if (s < 60) return s > 0 ? T.lessThanMin : `0 ${T.min}`;
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h} h ${String(m).padStart(2, '0')}` : `${m} ${T.min}`;
}
function fmtBig(s) {
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h}<small>h</small>${String(m).padStart(2, '0')}<small>${T.min}</small>` : `${m}<small>${T.min}</small>`;
}
// Numbers that count up when a view opens. kind: big | dur | int | days
const RENDER = { big: v => fmtBig(v), dur: v => fmt(v), int: v => String(Math.round(v)), days: v => T.days(Math.round(v)) };
const num = (value, kind) => `<span data-count="${value}" data-kind="${kind}">${RENDER[kind](value)}</span>`;
function countUp(root) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  root.querySelectorAll('[data-count]').forEach((el, n) => {
    const to = +el.dataset.count, kind = el.dataset.kind, t0 = performance.now() + 150 + n * 40, dur = 1300;
    el.innerHTML = RENDER[kind](0);
    const step = now => {
      const p = Math.min(1, Math.max(0, (now - t0) / dur)), e = 1 - Math.pow(1 - p, 4);
      el.innerHTML = RENDER[kind](to * e);
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
const clock = t => t == null ? '–' : `${String(Math.floor(t / 3600) % 24).padStart(2, '0')}:${String(Math.floor(t % 3600 / 60)).padStart(2, '0')}`;
const day = (label, opts) => new Date(label + 'T12:00').toLocaleDateString(T.locale, opts);
let colors = {}, ICON_V = Date.now();
function setColors(names) { colors = {}; names.forEach((n, i) => colors[n] = PALETTE[i % PALETTE.length]); }
const color = name => colors[name] || '#555';
function avatar(a) {
  // The app's real icon when available, its initial otherwise.
  return `<div class="avatar" style="background:${color(a.name)}"><img src="/icon/${encodeURIComponent(a.process)}?v=${ICON_V}" alt=""
    onload="this.parentNode.style.background='transparent';this.nextSibling.remove()" onerror="this.remove()"><span>${esc((a.name[0] || '?').toUpperCase())}</span></div>`;
}
function delta(cur, prev, what) {
  if (!prev) return `<span class="chip">${T.noCompare}</span>`;
  const p = Math.round(100 * (cur - prev) / prev);
  if (p === 0) return `<span class="chip">= ${what}</span>`;
  return `<span class="chip">${p > 0 ? '↑' : '↓'} ${Math.abs(p)} % ${what}</span>`;
}
function change(a) {
  const d = a.seconds - a.previous;
  if (!a.previous && !a.seconds) return '';
  if (Math.abs(d) < 60) return '<small>=</small>';
  return `<small>${d > 0 ? '+' : '−'}${fmt(d)}</small>`;
}
function ring(value, goal) {
  const r = 46, c = 2 * Math.PI * r, f = goal ? Math.min(value / goal, 1) : 0, over = goal && value > goal;
  return `<svg class="ring" width="120" height="120" viewBox="0 0 116 116" aria-hidden="true">
    <circle cx="58" cy="58" r="${r}" fill="none" stroke="#2c2c2e" stroke-width="11"/>
    <circle class="ring-arc" cx="58" cy="58" r="${r}" fill="none" stroke="${over ? '#ff9f0a' : '#f5f5f7'}" stroke-width="11" stroke-linecap="round"
      data-dash="${c * f} ${c}" stroke-dasharray="${c * f} ${c}" transform="rotate(-90 58 58)"/>
    <text x="58" y="65" text-anchor="middle" fill="#f5f5f7" font-size="21" font-weight="700">${goal ? Math.round(100 * value / goal) : 0}%</text></svg>`;
}
// Bars with hover tooltips. items: [{label, tip, value, now}]
function bars(items, goal) {
  const max = Math.max(1, goal || 0, ...items.map(i => i.value)) * 1.08;
  const line = goal ? `<div class="goal-line" style="bottom:${100 * goal / max}%"><span>${T.goalWord}</span></div>` : '';
  return `<div class="bars ${goal ? 'goal' : ''}">${line}${items.map((i, j) => `<div style="--j:${j}" class="b ${i.value ? '' : 'zero'} ${goal && i.value > goal ? 'over' : ''} ${i.now ? 'now' : ''}" data-tip="${esc(i.tip)}">
    <i style="height:${Math.max(1.5, 100 * i.value / max)}%"></i></div>`).join('')}</div>
    <div class="xl ${goal ? 'goal' : ''}">${items.map(i => `<span>${esc(i.label)}</span>`).join('')}</div>`;
}
function appList(apps, total) {
  const shown = apps.filter(a => a.seconds > 0);
  if (!shown.length) return `<div class="empty">${T.empty}</div>`;
  const max = shown[0].seconds;
  return `<div class="list">${shown.map((a, j) => `<div class="item" style="--j:${j}">${avatar(a)}
    <div><div class="name"><span class="nm">${esc(a.name)}${editBtn(a)}</span><em>${total ? Math.round(100 * a.seconds / total) : 0} %</em></div>
    <div class="track"><i style="width:${100 * a.seconds / max}%;background:${color(a.name)}"></i></div></div>
    <div class="t">${fmt(a.seconds)}${change(a)}</div></div>`).join('')}</div>`;
}
const editBtn = a => `<button class="edit" title="${esc(T.edit)}" data-edit="${esc(JSON.stringify({ key: a.key, name: a.name, process: a.process }))}">✎</button>`;
function projectList(projects) {
  const max = projects[0].seconds;
  return `<div class="list">${projects.map((p, j) => `<div class="item" style="--j:${j}">${avatar({ name: p.app, process: p.process })}
    <div><div class="name">${esc(p.name)}<em>${esc(p.app)}</em></div><div class="track"><i style="width:${100 * p.seconds / max}%"></i></div></div>
    <div class="t">${fmt(p.seconds)}</div></div>`).join('')}</div>`;
}
const getJSON = async url => (await fetch(url)).json();
const tile = (label, value, hint, cls = '') => `<div class="card tile"><div class="label">${label}</div><div class="v">${value}</div><div class="hint ${cls}">${hint}</div></div>`;

// Shows a view. With `animate`, cards rise in one after the other, numbers count up,
// rings draw and bars grow; the automatic refresh passes false so nothing moves.
function render(html, animate) {
  const v = $('#view');
  v.classList.toggle('anim', animate && !matchMedia('(prefers-reduced-motion: reduce)').matches);
  v.innerHTML = html;
  if (!animate) return;
  v.querySelectorAll('h1.title, .lead, .card, section.block > h2, section.block > .hint-line, .w-nav, .w-hero')
    .forEach((el, i) => { el.classList.add('rv'); el.style.setProperty('--i', i); });
  v.querySelectorAll('.heat i').forEach((el, i) => el.style.setProperty('--c', Math.floor(i / 7)));
  countUp(v);
  v.querySelectorAll('.ring-arc').forEach(el => {
    el.setAttribute('stroke-dasharray', '0 400');
    requestAnimationFrame(() => requestAnimationFrame(() => el.setAttribute('stroke-dasharray', el.dataset.dash)));
  });
}

// ---------------------------------------------------------------- today / week / month
async function showRange(range, animate) {
  const d = await getJSON('/api/summary?range=' + range);
  setColors(d.apps.map(a => a.name));
  const today = range === 'today', w = d.wellbeing, f = d.focus;
  $('#period').textContent = today ? day(d.from, { weekday: 'long', day: 'numeric', month: 'long' })
    : `${day(d.from, { day: 'numeric', month: 'short' })} – ${day(d.to, { day: 'numeric', month: 'short' })}`;
  const avg = d.total / Math.max(1, d.days_elapsed), ringVal = today ? d.total : avg;
  const goalText = !d.goal ? T.noGoal : ringVal > d.goal ? T.goalOver(fmt(d.goal), fmt(ringVal - d.goal)) : T.goalLeft(fmt(d.goal), fmt(d.goal - ringVal));
  const longOk = w.longest_stretch <= 90 * 60;

  let timeline;
  if (today) {
    const segs = d.segments, nowH = new Date().getHours();
    const first = segs.length ? segs[0].start : 9 * 3600, last = segs.length ? segs[segs.length - 1].end : 18 * 3600;
    const h0 = Math.min(8, Math.floor(first / 3600)), h1 = Math.max(20, Math.ceil(last / 3600));
    const span = (h1 - h0) * 3600, x = t => 100 * (t - h0 * 3600) / span;
    const names = [...new Set(segs.map(s => s.name))];
    const ticks = []; for (let h = h0; h <= h1; h += (h1 - h0 > 14 ? 3 : 2)) ticks.push(h);
    timeline = `<h2>${T.timeline}</h2>
      <div class="strip">${segs.map(s => `<i data-tip="${esc(s.name)} · ${clock(s.start)}–${clock(s.end)} · ${fmt(s.end - s.start)}"
        style="left:${x(s.start)}%;width:${x(s.end) - x(s.start)}%;background:${color(s.name)}"></i>`).join('')}</div>
      <div class="ticks">${ticks.map(h => `<span style="left:${x(h * 3600)}%">${h % 24}h</span>`).join('')}</div>
      <div class="legend">${names.slice(0, 10).map(n => `<span><b style="background:${color(n)}"></b>${esc(n)}</span>`).join('')}</div>
      <h2>${T.perHour}</h2>
      ${bars(d.timeline.map((b, i) => ({ label: i % 3 ? '' : b.label, tip: `${b.label} · ${fmt(b.seconds)}`, value: b.seconds / 60, now: i === nowH })))}`;
  } else {
    const opts = range === 'week' ? { weekday: 'short' } : { day: 'numeric' }, todayStr = new Date().toLocaleDateString('sv-SE');
    timeline = `<h2>${T.perDay}</h2>${bars(d.timeline.map(b => ({ label: day(b.label, opts), now: b.label === todayStr,
      tip: `${day(b.label, { weekday: 'long', day: 'numeric', month: 'long' })} · ${fmt(b.seconds)}`, value: b.seconds / 3600 })), d.goal / 3600)}`;
  }

  render(`
  <h1 class="title">${T.titles[range]}</h1><p class="lead">${T.lead[range]}</p>
  <div class="row c2">
    <div class="card"><div class="label">${T.screen}</div><div class="big">${num(d.total, 'big')}</div>${delta(d.total, d.previous_total, T.vs[range])}
      ${today ? '' : `<div class="sub">${T.avg(fmt(avg), d.days_elapsed)}</div>`}</div>
    <div class="card goal">${ring(ringVal, d.goal)}<div><div class="label">${today ? T.goalToday : T.goalAvg}</div>
      <div class="v">${num(ringVal, 'dur')}</div><div class="sub" style="margin-top:4px">${goalText}</div></div></div>
  </div>
  <div class="card" style="margin-bottom:12px">${timeline}</div>
  <div class="row ${d.projects.length ? 'c2b' : ''}">
    <div class="card"><h2>${T.apps}</h2><p class="hint-line">${T.appsHint[range]}</p>${appList(d.apps, d.total)}</div>
    ${d.projects.length ? `<div class="card"><h2>${T.projects}</h2><p class="hint-line">${T.projectsHint}</p>${projectList(d.projects)}</div>` : ''}
  </div>
  <section class="block"><h2>${T.wellbeing}</h2><p class="hint-line">${T.wellbeingHint}</p>
  <div class="row c4">
    ${tile(T.breaks, num(w.breaks, 'int'), T.breaksHint(CONF.break_minutes || 5))}
    ${tile(T.longest, num(w.longest_stretch, 'dur'), !w.longest_stretch ? '–' : longOk ? T.longOk : T.longWarn, w.longest_stretch ? (longOk ? 'ok' : 'warn') : '')}
    ${tile(today ? T.day : T.dayRange, `${clock(w.first_start)} → ${clock(w.last_end)}`, T.dayHint)}
    ${tile(T.night, num(w.late_night, 'dur'), w.late_night > 1800 ? T.nightWarn : T.nightOk, w.late_night > 1800 ? 'warn' : 'ok')}
  </div></section>
  <section class="block"><h2>${T.focus}</h2><p class="hint-line">${T.focusHint}</p>
  <div class="row ${d.limits.length ? 'c3' : 'c2b'}">
    ${tile(T.deep, num(f.longest, 'dur'), T.deepHint(f.longest_app ? esc(f.longest_app) : ''))}
    ${tile(T.switches, num(f.switches, 'int'), T.switchesHint(f.switches_per_hour))}
    ${d.limits.length ? `<div class="card"><div class="label">${T.limits}</div>${d.limits.map(l => `<div style="margin-top:12px">
      <div class="name" style="display:flex;justify-content:space-between"><span>${esc(l.name)}</span><span style="color:var(--text-2)">${fmt(l.seconds)} / ${fmt(l.limit)}</span></div>
      <div class="track limit ${l.seconds >= l.limit ? 'over' : ''}" style="--j:2"><i style="width:${Math.min(100, 100 * l.seconds / l.limit)}%"></i></div></div>`).join('')}
      <div class="hint" style="margin-top:12px;color:var(--muted);font-size:12.5px">${T.limitsHint}</div></div>` : ''}
  </div></section>`, animate);
}

// ---------------------------------------------------------------- year
async function showYear(animate) {
  const y = await getJSON('/api/year');
  $('#period').textContent = T.yearTotal;
  const max = Math.max(...y.days, 1), q = s => !s ? 0 : s < max * .25 ? 1 : s < max * .5 ? 2 : s < max * .75 ? 3 : 4;
  const start = new Date(y.from + 'T12:00'), cells = [], months = [];
  const total = Math.ceil(y.days.length / 7) * 7;
  for (let i = 0; i < total; i++) {
    const dt = new Date(start); dt.setDate(start.getDate() + i);
    const label = dt.toLocaleDateString(T.locale, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    cells.push(i < y.days.length ? `<i class="l${q(y.days[i])}" data-tip="${esc(label)} · ${fmt(y.days[i])}"></i>` : '<i class="future"></i>');
    if (i % 7 === 0) months.push(dt.getDate() <= 7 ? `<span>${dt.toLocaleDateString(T.locale, { month: 'short' })}</span>` : '<span></span>');
  }
  const fs = y.focus_streak, gs = y.goal_streak;
  render(`
  <h1 class="title">${T.year}</h1><p class="lead">${T.yearLead}</p>
  <div class="card" style="margin-bottom:12px"><div class="months" style="grid-template-columns:repeat(${total / 7},13px)">${months.join('')}</div>
    <div class="heat">${cells.join('')}</div>
    <div class="scale">${T.less} <i style="background:var(--card-2)"></i><i style="background:rgba(10,132,255,.3)"></i><i style="background:rgba(10,132,255,.55)"></i><i style="background:rgba(10,132,255,.8)"></i><i style="background:#4aa3ff"></i> ${T.more}</div></div>
  <div class="row c2b">
    <div class="card streak"><div class="label">${T.focusStreak}</div><div class="v">${num(fs.current, 'days')}</div>
      <div class="sub">${T.focusStreakHint(y.streak_minutes, esc(y.focus_apps.slice(0, 4).join(', ') + (y.focus_apps.length > 4 ? '…' : '')))} · ${T.best(fs.best)}</div></div>
    <div class="card streak"><div class="label">${T.goalStreak}</div><div class="v">${y.goal ? num(gs.current, 'days') : '–'}</div>
      <div class="sub">${y.goal ? `${T.goalStreakHint(fmt(y.goal))} · ${T.best(gs.best)}` : T.noGoal}</div></div>
  </div>
  <div class="row c3">
    ${tile(T.yearTotal, num(y.total, 'dur'), T.activeDays(y.active_days))}
    ${tile(T.bestDay, y.best_day ? fmt(y.best_day.seconds) : '–', y.best_day ? day(y.best_day.label, { weekday: 'long', day: 'numeric', month: 'long' }) : '')}
    ${tile(T.avgActive, num(y.total / Math.max(1, y.active_days), 'dur'), T.activeDays(y.active_days))}
  </div>`, animate);
}

// ---------------------------------------------------------------- wrapped
let weeksAgo = 1, lastWrapped = null;
function personaText(p) {
  const [title, text] = T.personas[p.kind] || T.personas.balanced;
  return [typeof title === 'function' ? title(p) : title, text(p)];
}
async function showWrapped(animate = true) {
  const d = lastWrapped = await getJSON('/api/wrapped?weeks_ago=' + weeksAgo);
  setColors(d.top_apps.map(a => a.name));
  const w = d.wellbeing, top = d.top_apps[0], [ptitle, ptext] = personaText(d.persona);
  const name = weeksAgo === 0 ? T.thisWeek : weeksAgo === 1 ? T.lastWeek : T.weeksAgo(weeksAgo);
  const range = `${day(d.from, { day: 'numeric', month: 'long' })} – ${day(d.to, { day: 'numeric', month: 'long' })}`;
  $('#period').textContent = range;
  const mover = (a, cls) => a ? `<div class="move">${avatar(a)}<b>${esc(a.name)}</b><span class="d">${a.seconds > a.previous ? '+' : '−'}${fmt(a.seconds - a.previous)}</span></div>` : '';
  // Title letters are wrapped one by one (words stay unbroken) for the reveal animation.
  let k = 0;
  const letters = ptitle.split(' ').map(word => `<span class="w">${[...word].map(ch => `<span style="--k:${k++}">${esc(ch)}</span>`).join('')}</span>`).join(' ');
  render(`
  <div class="w-nav"><button class="btn ghost" id="prev">${T.prevWeek}</button><b>${name}</b>
    <span style="display:flex;gap:8px"><button class="btn ghost" id="next" ${weeksAgo === 0 ? 'disabled' : ''}>${T.nextWeek}</button>
    <button class="btn" id="share">${T.share}</button></span></div>
  <section class="w-hero">
    <div class="label">${T.yourWrapped} · ${range}</div>
    <div class="emoji p-${esc(d.persona.kind)}"><span>${d.persona.emoji}</span></div><h1 aria-label="${esc(ptitle)}">${letters}</h1><p>${esc(ptext)}</p>
  </section>
  <div class="row c3">
    <div class="card stat"><div class="label">${T.total}</div><div class="v">${num(d.total, 'dur')}</div>${delta(d.total, d.previous_total, T.vsPrevWeek)}
      <div class="sub">${T.activeLine(d.active_days, fmt(d.total / Math.max(1, d.active_days)))}</div></div>
    <div class="card stat"><div class="label">${T.top1}</div>
      ${top ? `<div class="top1">${avatar(top)}<div><div class="v" style="font-size:26px;margin:0">${esc(top.name)}</div>
        <div class="sub" style="margin:2px 0 0">${fmt(top.seconds)} · ${T.ofWeek(Math.round(100 * top.seconds / d.total))}</div></div></div>` : '<div class="v">–</div>'}</div>
    <div class="card stat"><div class="label">${T.busiest}</div>
      <div class="v" style="text-transform:capitalize">${d.busiest_day ? day(d.busiest_day.label, { weekday: 'long' }) : '–'}</div>
      <div class="sub">${d.busiest_day ? fmt(d.busiest_day.seconds) : ''}</div></div>
  </div>
  <div class="row c2b">
    <div class="card"><h2>${T.top5}</h2><p class="hint-line">${T.used(d.app_count)}</p>${appList(d.top_apps, d.total)}</div>
    <div class="card"><h2>${T.byDay}</h2>${bars(d.days.map(b => ({ label: day(b.label, { weekday: 'short' }),
      tip: `${day(b.label, { weekday: 'long' })} · ${fmt(b.seconds)}`, value: b.seconds / 3600 })), d.goal / 3600)}</div>
  </div>
  <div class="row ${d.top_projects.length ? 'c2b' : ''}">
    <div class="card"><h2>${T.movers}</h2>${d.rise || d.fall ? `${d.rise ? `<div class="label" style="margin-top:10px">↑ ${T.rise}</div>${mover(d.rise)}` : ''}
      ${d.fall ? `<div class="label" style="margin-top:10px">↓ ${T.fall}</div>${mover(d.fall)}` : ''}` : `<div class="empty">${T.noMove}</div>`}</div>
    ${d.top_projects.length ? `<div class="card"><h2>${T.topProjects}</h2>${projectList(d.top_projects)}</div>` : ''}
  </div>
  <div class="row c4">
    ${tile(T.peak, d.peak_hour == null ? '–' : `${d.peak_hour}h – ${d.peak_hour + 1}h`, '')}
    ${tile(T.record, num(w.longest_stretch, 'dur'), '')}
    ${tile(T.dayRange, `${clock(w.first_start)} → ${clock(w.last_end)}`, '')}
    ${tile(T.overGoal, `${d.days_over_goal} / 7`, T.breaksNight(w.breaks, fmt(w.late_night)))}
  </div>`, animate);
  $('#prev').onclick = () => { weeksAgo++; showWrapped(); };
  $('#next').onclick = () => { if (weeksAgo > 0) { weeksAgo--; showWrapped(); } };
  $('#share').onclick = shareImage;
}

// A 1080x1350 image of the Wrapped, drawn locally and downloaded as PNG.
async function shareImage() {
  const d = lastWrapped; if (!d) return;
  const W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H;
  await Promise.all(['500 40px Manrope', '700 40px Manrope', '800 40px Manrope'].map(f => document.fonts.load(f)));
  const g = c.getContext('2d'), F = 'Manrope, "Segoe UI", sans-serif';
  const load = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#1c1c1e'; g.beginPath(); g.roundRect(40, 40, W - 80, H - 80, 56); g.fill();
  const logo = await load('/logo.png'); if (logo) g.drawImage(logo, 80, 80, 64, 64);
  g.fillStyle = '#f5f5f7'; g.font = `700 32px ${F}`; g.fillText('Activity Tracker', 164, 122);
  g.fillStyle = '#a1a1a6'; g.font = `500 30px ${F}`;
  g.fillText(`${T.yourWrapped} · ${day(d.from, { day: 'numeric', month: 'short' })} – ${day(d.to, { day: 'numeric', month: 'short' })}`, 80, 250);
  const [ptitle, ptext] = personaText(d.persona);
  g.font = `120px "Segoe UI Emoji", ${F}`; g.fillText(d.persona.emoji, 72, 410);
  g.fillStyle = '#f5f5f7'; g.font = `800 92px ${F}`; g.letterSpacing = '-4px'; g.fillText(ptitle, 76, 540); g.letterSpacing = '0px';
  g.fillStyle = '#a1a1a6'; g.font = `500 34px ${F}`; g.fillText(ptext, 80, 600);
  g.fillStyle = '#6e6e73'; g.font = `600 28px ${F}`; g.fillText(T.total, 80, 720);
  g.fillStyle = '#f5f5f7'; g.font = `700 120px ${F}`; g.letterSpacing = '-5px'; g.fillText(fmt(d.total), 74, 840); g.letterSpacing = '0px';
  g.fillStyle = '#6e6e73'; g.font = `600 28px ${F}`; g.fillText(T.top5, 80, 920);
  for (const [i, a] of d.top_apps.slice(0, 3).entries()) {
    const y = 955 + i * 88, icon = await load('/icon/' + encodeURIComponent(a.process) + '?v=' + ICON_V);
    if (icon) g.drawImage(icon, 80, y, 60, 60);
    else { g.fillStyle = color(a.name); g.beginPath(); g.roundRect(80, y, 60, 60, 14); g.fill(); g.fillStyle = '#fff'; g.font = `600 30px ${F}`; g.fillText(a.name[0].toUpperCase(), 100, y + 41); }
    g.fillStyle = '#f5f5f7'; g.font = `600 40px ${F}`; g.fillText(a.name, 166, y + 44);
    g.fillStyle = '#a1a1a6'; g.textAlign = 'right'; g.fillText(fmt(a.seconds), W - 80, y + 44); g.textAlign = 'left';
  }
  g.fillStyle = '#6e6e73'; g.font = `500 26px ${F}`; g.fillText('ef tools · Activity Tracker', 80, H - 84);
  const a = document.createElement('a'); a.download = `wrapped-${d.from}.png`; a.href = c.toDataURL('image/png'); a.click();
}

// ---------------------------------------------------------------- apps & customization
async function showApps(animate) {
  const apps = await getJSON('/api/apps');
  setColors(apps.map(a => a.name));
  $('#period').textContent = '';
  render(`<h1 class="title">${T.appsTitle}</h1><p class="lead">${T.appsLead}</p>
    <div class="card">${apps.length ? `<div class="list applist">${apps.map(a => `<div class="item">${avatar(a)}
      <div><div class="name"><span class="nm">${esc(a.name)}</span><em>${a.renamed ? esc(T.original(a.key)) + ' · ' : ''}${esc(a.process)}${a.custom_icon ? ' · ' + T.customLogo : ''}</em></div></div>
      <button class="btn ghost small" data-edit="${esc(JSON.stringify({ key: a.key, name: a.name, process: a.process }))}">${T.edit}</button></div>`).join('')}</div>`
      : `<div class="empty">${T.noApps}</div>`}</div>`, animate);
}

const WRITE = { 'X-Activity-Tracker': '1' };
let editing = null, newLogo = null, resetLogo = false;
function editorAvatar() {
  const a = { name: $('#ed-name').value || editing.key, process: editing.process };
  $('#ed-avatar').innerHTML = avatar(a);
  if (newLogo || resetLogo) {
    const img = $('#ed-avatar img');
    if (img) img.src = newLogo ? URL.createObjectURL(newLogo) : `/icon/${encodeURIComponent(editing.process)}?v=${ICON_V}&original=1`;
  }
}
function openEditor(a) {
  editing = a; newLogo = null; resetLogo = false;
  $('#ed-title').textContent = T.edit; $('#ed-hint').textContent = T.editHint;
  $('#ed-pick').textContent = T.pickLogo; $('#ed-reset-logo').textContent = T.resetLogo;
  $('#ed-name-label').textContent = T.nameLabel; $('#ed-reset-name').textContent = T.resetName(a.key);
  $('#ed-cancel').textContent = T.cancel; $('#ed-save').textContent = T.save;
  $('#ed-name').value = a.name; $('#ed-err').textContent = '';
  editorAvatar();
  $('#editor').showModal();
}
// Any image (PNG, JPG, SVG, ICO, WebP…) becomes a 128x128 PNG, centered and uncropped.
function toLogoPng(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const S = 128, c = document.createElement('canvas'); c.width = c.height = S;
      const w = img.naturalWidth || S, h = img.naturalHeight || S, k = S / Math.max(w, h);
      c.getContext('2d').drawImage(img, (S - w * k) / 2, (S - h * k) / 2, w * k, h * k);
      c.toBlob(b => b ? resolve(b) : reject(), 'image/png');
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
$('#ed-pick').onclick = () => $('#ed-file').click();
$('#ed-file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try { newLogo = await toLogoPng(f); resetLogo = false; $('#ed-err').textContent = ''; editorAvatar(); }
  catch { $('#ed-err').textContent = T.badImage; }
};
$('#ed-reset-logo').onclick = () => { resetLogo = true; newLogo = null; editorAvatar(); };
$('#ed-reset-name').onclick = () => { $('#ed-name').value = editing.key; editorAvatar(); };
$('#ed-name').oninput = editorAvatar;
$('#ed-cancel').onclick = () => $('#editor').close();
$('#edit-form').onsubmit = async e => {
  e.preventDefault();
  const send = async (url, opts) => { const r = await fetch(url, opts); if (!r.ok) throw new Error(await r.text()); };
  try {
    const name = $('#ed-name').value.trim();
    if (name !== editing.name) await send('/api/apps/rename', { method: 'POST', headers: { ...WRITE, 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: editing.key, name: name === editing.key ? '' : name }) });
    const iconUrl = '/api/apps/icon?key=' + encodeURIComponent(editing.key);
    if (newLogo) await send(iconUrl, { method: 'POST', headers: { ...WRITE, 'Content-Type': 'image/png' }, body: newLogo });
    else if (resetLogo) await send(iconUrl, { method: 'DELETE', headers: WRITE });
    ICON_V = Date.now();
    $('#editor').close();
    route(false);
  } catch (err) { $('#ed-err').textContent = T.saveError + err.message; }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-edit]');
  if (b) openEditor(JSON.parse(b.dataset.edit));
});

// ---------------------------------------------------------------- router
const VIEWS = ['today', 'week', 'month', 'year', 'wrapped', 'apps'];
function movePill() {
  const on = $('nav a.on'), pill = $('nav .pill');
  if (on && pill) { pill.style.width = on.offsetWidth + 'px'; pill.style.transform = `translateX(${on.offsetLeft}px)`; }
}
function route(animate = true) {
  const r = (location.hash || '#today').slice(1), view = VIEWS.includes(r) ? r : 'today';
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.hash === '#' + view));
  movePill();
  if (animate) $('nav a.on')?.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
  const p = { wrapped: showWrapped, year: showYear, apps: showApps }[view]?.(animate) ?? showRange(view, animate);
  p.catch(() => $('#view').innerHTML = `<div class="card empty">${T.offline}</div>`);
}
async function init() {
  try { CONF = await getJSON('/api/config'); } catch { CONF = {}; }
  T = I18N[CONF.lang] || I18N[(navigator.language || 'en').slice(0, 2)] || I18N.en;
  document.documentElement.lang = CONF.lang || 'en';
  $('#nav').innerHTML = '<span class="pill"></span>' + VIEWS.map(v => `<a href="#${v}">${T.nav[v]}</a>`).join('');
  $('#foot-local').textContent = T.local;
  $('#foot-export').textContent = T.export;
  $('#foot-version').textContent = 'v' + (CONF.version || '');
  window.addEventListener('hashchange', () => { scrollTo({ top: 0 }); route(); });
  addEventListener('resize', movePill);
  addEventListener('scroll', () => $('#top').classList.toggle('scrolled', scrollY > 4), { passive: true });
  route();
  // The nav pill must be measured with the final font.
  document.fonts.ready.then(movePill);
  setInterval(() => { if (!document.hidden && !$('#editor').open && !['#wrapped', '#year', '#apps'].includes(location.hash)) route(false); }, 60000);
}
init();

// Tooltips
const tip = $('#tip');
document.addEventListener('mousemove', e => {
  const t = e.target.closest('[data-tip]');
  if (!t) { tip.classList.remove('on'); return; }
  tip.textContent = t.dataset.tip;
  tip.classList.add('on');
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top = (e.clientY - 38) + 'px';
});
</script>
