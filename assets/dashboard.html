<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity Tracker</title>
<link rel="icon" href="/favicon.ico">
<style>
:root {
  color-scheme: dark;
  --bg: #161616; --card: #1c1c1c; --card-2: #232323; --line: #2a2a2a; --line-2: #333;
  --text: #f2f2f2; --text-2: #a3a3a3; --muted: #6e6e6e;
  --accent: #4d7cff; --good: #3ecf8e; --warn: #f0a33a;
  --font: "Inter", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; color: var(--text); font: 14px/1.55 var(--font); -webkit-font-smoothing: antialiased; min-height: 100vh;
  background:
    linear-gradient(var(--bg) 0, transparent 10%, transparent 90%, var(--bg) 100%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.028) 0 1px, transparent 1px 64px),
    repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0 1px, transparent 1px 64px), var(--bg);
  background-attachment: fixed; }
a { color: inherit; }
main { max-width: 1100px; margin: 0 auto; padding: 0 16px 56px; }
header { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px; height: 64px; margin-bottom: 28px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; white-space: nowrap; }
.brand img { width: 30px; height: 30px; }
.brand b { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.brand small { color: var(--muted); font-size: 12px; margin-left: 4px; }
nav { display: flex; gap: 4px; justify-self: center; }
@media (max-width: 1180px) { .brand small { display: none; } }
nav a { color: var(--text-2); text-decoration: none; padding: 7px 14px; border-radius: 999px; font-weight: 500; border: 1px solid transparent; white-space: nowrap; transition: color .15s; }
nav a:hover { color: var(--text); }
nav a.on { color: var(--text); border-color: var(--line-2); background: rgba(255,255,255,.03); }
.head-right { justify-self: end; color: var(--muted); font-size: 13px; }
@media (max-width: 820px) {
  header { grid-template-columns: 1fr; height: auto; padding-top: 16px; }
  nav { flex-wrap: wrap; } nav a { padding: 6px 11px; } .head-right { display: none; } .brand small { display: none; }
}
h1.title { font-size: clamp(30px, 5vw, 46px); font-weight: 600; letter-spacing: -.035em; line-height: 1.05; margin: 0 0 6px; }
.lead { color: var(--text-2); margin: 0 0 26px; font-size: 15px; }
h2 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; margin: 0 0 4px; }
.hint-line { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
.label { color: var(--text-2); font-size: 13px; font-weight: 500; }
.row { display: grid; gap: 12px; margin-bottom: 12px; }
.c2 { grid-template-columns: 1.55fr 1fr; } .c3 { grid-template-columns: repeat(3, 1fr); } .c4 { grid-template-columns: repeat(4, 1fr); }
.c2b { grid-template-columns: 1fr 1fr; }
@media (max-width: 860px) { .c2, .c2b, .c3 { grid-template-columns: 1fr; } .c4 { grid-template-columns: 1fr 1fr; } }
section.block { margin-top: 36px; }
.big { font-size: clamp(44px, 7vw, 64px); font-weight: 600; letter-spacing: -.045em; line-height: 1; margin: 12px 0 14px; font-variant-numeric: tabular-nums; }
.big small { font-size: .42em; color: var(--text-2); font-weight: 500; letter-spacing: -.01em; margin: 0 6px 0 2px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 500;
  color: var(--text-2); border: 1px solid var(--line-2); }
.sub { color: var(--text-2); font-size: 13px; margin-top: 12px; }
.goal { display: flex; align-items: center; gap: 20px; }
.goal svg { flex: none; }
.goal .v { font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
.tile .v { font-size: 26px; font-weight: 600; letter-spacing: -.03em; margin: 8px 0 2px; font-variant-numeric: tabular-nums; }
.tile .hint { color: var(--muted); font-size: 12.5px; }
.tile .hint.warn { color: var(--warn); } .tile .hint.ok { color: var(--good); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; background: var(--muted); }
.strip { position: relative; height: 30px; border-radius: 8px; background: var(--card-2); overflow: hidden; margin: 14px 0 4px; }
.strip i { position: absolute; top: 0; bottom: 0; border-right: 1px solid var(--card); min-width: 2px; }
.ticks { position: relative; height: 18px; color: var(--muted); font-size: 11px; margin-bottom: 12px; }
.ticks span { position: absolute; transform: translateX(-50%); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--text-2); font-size: 12.5px; margin-bottom: 26px; }
.legend b { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.bars { display: flex; align-items: flex-end; gap: 4px; height: 160px; position: relative; margin-top: 14px; }
.bars .b { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; min-width: 0; }
.bars .b i { display: block; width: 100%; max-width: 30px; border-radius: 4px 4px 1px 1px; background: #d6d6d6; min-height: 2px; transition: background .15s; }
.bars .b.zero i { background: var(--card-2); }
.bars .b.now i { background: var(--accent); }
.bars .b.over i { background: var(--warn); }
.bars .b:hover i { background: #fff; }
.bars .goal-line { position: absolute; left: 0; right: 0; border-top: 1px dashed rgba(240,163,58,.6); pointer-events: none; }
.bars .goal-line span { position: absolute; left: 0; top: -9px; font-size: 11px; line-height: 16px; color: var(--warn); background: var(--card); padding-right: 6px; }
.xl { display: flex; gap: 4px; margin-top: 8px; color: var(--muted); font-size: 11px; }
.xl span { flex: 1; text-align: center; min-width: 0; white-space: nowrap; }
.list { display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: 32px 1fr auto; gap: 14px; align-items: center; padding: 10px 4px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item .name { font-weight: 500; display: flex; justify-content: space-between; gap: 10px; }
.item .name em { font-style: normal; color: var(--muted); font-size: 12.5px; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track { height: 4px; background: var(--card-2); border-radius: 2px; margin-top: 7px; overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 2px; background: #d6d6d6; }
.track.limit i { background: var(--accent); } .track.limit.over i { background: var(--warn); }
.item .t { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 76px; }
.item .t small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.avatar { position: relative; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; font-weight: 600; color: #fff; font-size: 14px; }
.avatar img { position: absolute; width: 28px; height: 28px; }
.empty { color: var(--muted); text-align: center; padding: 28px 0; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 10px; font: 500 14px var(--font); cursor: pointer; text-decoration: none;
  background: #ededed; color: #111; border: 1px solid #ededed; }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--line-2); }
.btn:disabled { opacity: .35; cursor: default; }
#tip { position: fixed; pointer-events: none; background: #262626; border: 1px solid var(--line-2); color: var(--text); font-size: 12.5px;
  padding: 6px 10px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.45); opacity: 0; z-index: 10; white-space: nowrap; }
/* Year */
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; overflow-x: auto; padding-bottom: 4px; }
.heat i { width: 13px; height: 13px; border-radius: 3px; background: var(--card-2); }
.heat i.l1 { background: #1e3473; } .heat i.l2 { background: #2b4dad; } .heat i.l3 { background: #3d68e0; } .heat i.l4 { background: #7fa0ff; }
.heat i.future { background: transparent; }
.months { display: grid; grid-auto-flow: column; gap: 3px; color: var(--muted); font-size: 11px; margin-bottom: 6px; overflow: hidden; }
.months span { width: 13px; white-space: nowrap; }
.scale { display: flex; align-items: center; gap: 3px; color: var(--muted); font-size: 11.5px; margin-top: 10px; justify-content: flex-end; }
.scale i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.streak .v { font-size: 40px; font-weight: 600; letter-spacing: -.04em; }
/* Wrapped */
.w-nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.w-hero { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 18px; padding: 44px 34px; margin-bottom: 12px;
  background: radial-gradient(600px 300px at 85% 110%, rgba(77,124,255,.28), transparent 70%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 48px),
    repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 48px), #121212; }
.w-hero .emoji { font-size: 60px; line-height: 1; margin: 20px 0 14px; }
.w-hero h1 { font-size: clamp(36px, 6vw, 58px); font-weight: 600; letter-spacing: -.045em; line-height: 1; margin: 0; }
.w-hero p { font-size: 17px; color: var(--text-2); margin: 12px 0 0; max-width: 600px; }
.stat .v { font-size: 34px; font-weight: 600; letter-spacing: -.04em; margin: 8px 0 6px; }
.top1 { display: flex; align-items: center; gap: 16px; margin-top: 12px; }
.top1 .avatar { width: 56px; height: 56px; border-radius: 14px; font-size: 22px; }
.top1 .avatar img { width: 48px; height: 48px; }
.move { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.move .d { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
.edit { opacity: 0; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; padding: 2px 6px; border-radius: 6px; }
.item:hover .edit, .edit:focus-visible { opacity: 1; } .edit:hover { color: var(--text); background: var(--card-2); }
@media (hover: none) { .edit { opacity: 1; } }
.name .nm { display: inline-flex; align-items: center; gap: 4px; min-width: 0; }
dialog { background: var(--card); color: var(--text); border: 1px solid var(--line-2); border-radius: 16px; padding: 26px; width: min(440px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0,0,0,.6); }
dialog h2 { font-size: 20px; margin-bottom: 4px; }
dialog .preview { display: flex; align-items: center; gap: 16px; margin: 20px 0; }
dialog .preview .avatar { width: 64px; height: 64px; border-radius: 16px; font-size: 26px; }
dialog .preview .avatar img { width: 56px; height: 56px; }
dialog label { display: block; color: var(--text-2); font-size: 13px; margin: 4px 0 6px; }
dialog input[type=text] { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; font: 15px var(--font); }
dialog input[type=text]:focus { outline: none; border-color: #555; }
.linkbtn { background: none; border: 0; color: var(--text-2); font: 13px var(--font); cursor: pointer; padding: 0; text-decoration: underline; }
.btn.small { padding: 7px 12px; font-size: 13px; }
.actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px; }
.err { color: #ef6b6b; font-size: 13px; min-height: 18px; margin-top: 8px; }
.applist .item { grid-template-columns: 32px 1fr auto; }
footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; color: var(--muted); font-size: 12.5px; }
footer a { color: var(--text-2); }
</style>
</head>
<body>
<main>
  <header>
    <a class="brand" href="#today"><img src="/logo.png" alt=""><b>Activity Tracker</b><small>by Enzo Freminet</small></a>
    <nav id="nav"></nav>
    <div class="head-right" id="period"></div>
  </header>
  <div id="view"></div>
  <footer>
    <span id="foot-local"></span>
    <span><a href="/api/export.csv" download id="foot-export"></a> · <span id="foot-version"></span> · ef tools</span>
  </footer>
</main>
<div id="tip"></div>
<dialog id="editor">
  <form method="dialog" id="edit-form">
    <h2 id="ed-title"></h2><p class="hint-line" id="ed-hint" style="margin:0"></p>
    <div class="preview"><div id="ed-avatar"></div>
      <div><button type="button" class="btn ghost small" id="ed-pick"></button><br>
        <button type="button" class="linkbtn" id="ed-reset-logo" style="margin-top:8px"></button></div>
      <input type="file" id="ed-file" accept="image/*,.ico,.svg" hidden></div>
    <label for="ed-name" id="ed-name-label"></label><input type="text" id="ed-name" maxlength="60" autocomplete="off">
    <div style="margin-top:8px"><button type="button" class="linkbtn" id="ed-reset-name"></button></div>
    <div class="err" id="ed-err"></div>
    <div class="actions"><button type="button" class="btn ghost" id="ed-cancel"></button><button type="submit" class="btn" id="ed-save"></button></div>
  </form>
</dialog>

let T = I18N.en, CONF = {};

// ---------------------------------------------------------------- helpers
const PALETTE = ['#4d7cff', '#e8774a', '#3ecf8e', '#d9a520', '#d6649a', '#9b8cff', '#ef6b6b', '#37b3c8'];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(s) {
  s = Math.round(Math.abs(s || 0));
  if (s < 60) return s > 0 ? T.lessThanMin : `0 ${T.min}`;
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h} h ${String(m).padStart(2, '0')}` : `${m} ${T.min}`;
}
function fmtBig(s) {
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h}<small>h</small>${String(m).padStart(2, '0')}<small>${T.min}</small>` : `${m}<small>${T.min}</small>`;
}
const clock = t => t == null ? '–' : `${String(Math.floor(t / 3600) % 24).padStart(2, '0')}:${String(Math.floor(t % 3600 / 60)).padStart(2, '0')}`;
const day = (label, opts) => new Date(label + 'T12:00').toLocaleDateString(T.locale, opts);
let colors = {}, ICON_V = Date.now();
function setColors(names) { colors = {}; names.forEach((n, i) => colors[n] = PALETTE[i % PALETTE.length]); }
const color = name => colors[name] || '#555';
function avatar(a) {
  // The app's real icon when available, its initial otherwise.
  return `<div class="avatar" style="background:${color(a.name)}"><img src="/icon/${encodeURIComponent(a.process)}?v=${ICON_V}" alt=""
    onload="this.parentNode.style.background='transparent';this.nextSibling.remove()" onerror="this.remove()"><span>${esc((a.name[0] || '?').toUpperCase())}</span></div>`;
}
function delta(cur, prev, what) {

  const p = Math.round(100 * (cur - prev) / prev);

}
function change(a) {

}

  return `<svg width="112" height="112" viewBox="0 0 116 116" aria-hidden="true">
    <circle cx="58" cy="58" r="${r}" fill="none" stroke="#2a2a2a" stroke-width="10"/>
    <circle cx="58" cy="58" r="${r}" fill="none" stroke="${over ? '#f0a33a' : '#f2f2f2'}" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${c * f} ${c}" transform="rotate(-90 58 58)"/>

}
// Bars with hover tooltips. items: [{label, tip, value, now}]

  return `<div class="bars">${line}${items.map(i => `<div class="b ${i.value ? '' : 'zero'} ${goal && i.value > goal ? 'over' : ''} ${i.now ? 'now' : ''}" data-tip="${esc(i.tip)}">
    <i style="height:${Math.max(1.5, 100 * i.value / max)}%"></i></div>`).join('')}</div>
    <div class="xl">${items.map(i => `<span>${esc(i.label)}</span>`).join('')}</div>`;

function appList(apps, total) {

    <div><div class="name"><span class="nm">${esc(a.name)}${editBtn(a)}</span><em>${total ? Math.round(100 * a.seconds / total) : 0} %</em></div>
    <div class="track"><i style="width:${100 * a.seconds / max}%;background:${color(a.name)}"></i></div></div>

}
const editBtn = a => `<button class="edit" title="${esc(T.edit)}" data-edit="${esc(JSON.stringify({ key: a.key, name: a.name, process: a.process }))}">✎</button>`;
function projectList(projects) {

const getJSON = async url => (await fetch(url)).json();
const tile = (label, value, hint, cls = '') => `<div class="card tile"><div class="label">${label}</div><div class="v">${value}</div><div class="hint ${cls}">${hint}</div></div>`;

// ---------------------------------------------------------------- today / week / month

  const avg = d.total / Math.max(1, d.days_elapsed), ringVal = today ? d.total : avg;
  const goalText = !d.goal ? T.noGoal : ringVal > d.goal ? T.goalOver(fmt(d.goal), fmt(ringVal - d.goal)) : T.goalLeft(fmt(d.goal), fmt(d.goal - ringVal));
  const longOk = w.longest_stretch <= 90 * 60;

      <div class="ticks">${ticks.map(h => `<span style="left:${x(h * 3600)}%">${h % 24}h</span>`).join('')}</div>

  <div class="row c2">

// ---------------------------------------------------------------- year

// ---------------------------------------------------------------- wrapped

// A 1080x1350 image of the Wrapped, drawn locally and downloaded as PNG.
async function shareImage() {
  const d = lastWrapped; if (!d) return;
  const W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'), F = getComputedStyle(document.body).fontFamily;
  const load = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
  g.fillStyle = '#111'; g.fillRect(0, 0, W, H);
  const glow = g.createRadialGradient(W * .85, H * 1.05, 0, W * .85, H * 1.05, 900);
  glow.addColorStop(0, 'rgba(77,124,255,.35)'); glow.addColorStop(1, 'rgba(77,124,255,0)'); g.fillStyle = glow; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(255,255,255,.045)'; g.lineWidth = 1;
  for (let x = 0; x <= W; x += 60) { g.beginPath(); g.moveTo(x + .5, 0); g.lineTo(x + .5, H); g.stroke(); }
  for (let y = 0; y <= H; y += 60) { g.beginPath(); g.moveTo(0, y + .5); g.lineTo(W, y + .5); g.stroke(); }
  const logo = await load('/logo.png'); if (logo) g.drawImage(logo, 80, 80, 64, 64);
  g.fillStyle = '#f2f2f2'; g.font = `600 32px ${F}`; g.fillText('Activity Tracker', 164, 122);
  g.fillStyle = '#a3a3a3'; g.font = `400 30px ${F}`;
  g.fillText(`${T.yourWrapped} · ${day(d.from, { day: 'numeric', month: 'short' })} – ${day(d.to, { day: 'numeric', month: 'short' })}`, 80, 250);
  const [ptitle, ptext] = personaText(d.persona);
  g.font = `120px "Segoe UI Emoji", ${F}`; g.fillText(d.persona.emoji, 72, 410);
  g.fillStyle = '#f2f2f2'; g.font = `600 92px ${F}`; g.fillText(ptitle, 76, 540);
  g.fillStyle = '#a3a3a3'; g.font = `400 34px ${F}`; g.fillText(ptext, 80, 600);
  g.fillStyle = '#6e6e6e'; g.font = `500 28px ${F}`; g.fillText(T.total.toUpperCase(), 80, 720);
  g.fillStyle = '#f2f2f2'; g.font = `600 120px ${F}`; g.fillText(fmt(d.total), 74, 840);
  g.fillStyle = '#6e6e6e'; g.font = `500 28px ${F}`; g.fillText(T.top5.toUpperCase(), 80, 950);
  for (const [i, a] of d.top_apps.slice(0, 3).entries()) {
    const y = 990 + i * 92, icon = await load('/icon/' + encodeURIComponent(a.process) + '?v=' + ICON_V);
    if (icon) g.drawImage(icon, 80, y, 60, 60);
    else { g.fillStyle = color(a.name); g.beginPath(); g.roundRect(80, y, 60, 60, 14); g.fill(); g.fillStyle = '#fff'; g.font = `600 30px ${F}`; g.fillText(a.name[0].toUpperCase(), 100, y + 41); }
    g.fillStyle = '#f2f2f2'; g.font = `500 40px ${F}`; g.fillText(a.name, 166, y + 44);
    g.fillStyle = '#a3a3a3'; g.textAlign = 'right'; g.fillText(fmt(a.seconds), W - 80, y + 44); g.textAlign = 'left';
  }
  g.fillStyle = '#6e6e6e'; g.font = `400 26px ${F}`; g.fillText('ef tools · Activity Tracker', 80, H - 70);
  const a = document.createElement('a'); a.download = `wrapped-${d.from}.png`; a.href = c.toDataURL('image/png'); a.click();
}

// ---------------------------------------------------------------- apps & customization
async function showApps() {
  const apps = await getJSON('/api/apps');
  setColors(apps.map(a => a.name));
  $('#period').textContent = '';
  $('#view').innerHTML = `<h1 class="title">${T.appsTitle}</h1><p class="lead">${T.appsLead}</p>
    <div class="card">${apps.length ? `<div class="list applist">${apps.map(a => `<div class="item">${avatar(a)}
      <div><div class="name"><span class="nm">${esc(a.name)}</span><em>${a.renamed ? esc(T.original(a.key)) + ' · ' : ''}${esc(a.process)}${a.custom_icon ? ' · ' + T.customLogo : ''}</em></div></div>
      <button class="btn ghost small" data-edit="${esc(JSON.stringify({ key: a.key, name: a.name, process: a.process }))}">${T.edit}</button></div>`).join('')}</div>`
      : `<div class="empty">${T.noApps}</div>`}</div>`;
}

const WRITE = { 'X-Activity-Tracker': '1' };
let editing = null, newLogo = null, resetLogo = false;
function editorAvatar() {
  const a = { name: $('#ed-name').value || editing.key, process: editing.process };
  $('#ed-avatar').innerHTML = avatar(a);
  if (newLogo || resetLogo) {
    const img = $('#ed-avatar img');
    if (img) img.src = newLogo ? URL.createObjectURL(newLogo) : `/icon/${encodeURIComponent(editing.process)}?v=${ICON_V}&original=1`;
  }
}
function openEditor(a) {
  editing = a; newLogo = null; resetLogo = false;
  $('#ed-title').textContent = T.edit; $('#ed-hint').textContent = T.editHint;
  $('#ed-pick').textContent = T.pickLogo; $('#ed-reset-logo').textContent = T.resetLogo;
  $('#ed-name-label').textContent = T.nameLabel; $('#ed-reset-name').textContent = T.resetName(a.key);
  $('#ed-cancel').textContent = T.cancel; $('#ed-save').textContent = T.save;
  $('#ed-name').value = a.name; $('#ed-err').textContent = '';
  editorAvatar();
  $('#editor').showModal();
}
// Any image (PNG, JPG, SVG, ICO, WebP…) becomes a 128x128 PNG, centered and uncropped.
function toLogoPng(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const S = 128, c = document.createElement('canvas'); c.width = c.height = S;
      const w = img.naturalWidth || S, h = img.naturalHeight || S, k = S / Math.max(w, h);
      c.getContext('2d').drawImage(img, (S - w * k) / 2, (S - h * k) / 2, w * k, h * k);
      c.toBlob(b => b ? resolve(b) : reject(), 'image/png');
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
$('#ed-pick').onclick = () => $('#ed-file').click();
$('#ed-file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try { newLogo = await toLogoPng(f); resetLogo = false; $('#ed-err').textContent = ''; editorAvatar(); }
  catch { $('#ed-err').textContent = T.badImage; }
};
$('#ed-reset-logo').onclick = () => { resetLogo = true; newLogo = null; editorAvatar(); };
$('#ed-reset-name').onclick = () => { $('#ed-name').value = editing.key; editorAvatar(); };
$('#ed-name').oninput = editorAvatar;
$('#ed-cancel').onclick = () => $('#editor').close();
$('#edit-form').onsubmit = async e => {
  e.preventDefault();
  const send = async (url, opts) => { const r = await fetch(url, opts); if (!r.ok) throw new Error(await r.text()); };
  try {
    const name = $('#ed-name').value.trim();
    if (name !== editing.name) await send('/api/apps/rename', { method: 'POST', headers: { ...WRITE, 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: editing.key, name: name === editing.key ? '' : name }) });
    const iconUrl = '/api/apps/icon?key=' + encodeURIComponent(editing.key);
    if (newLogo) await send(iconUrl, { method: 'POST', headers: { ...WRITE, 'Content-Type': 'image/png' }, body: newLogo });
    else if (resetLogo) await send(iconUrl, { method: 'DELETE', headers: WRITE });
    ICON_V = Date.now();
    $('#editor').close();
    route();
  } catch (err) { $('#ed-err').textContent = T.saveError + err.message; }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-edit]');
  if (b) openEditor(JSON.parse(b.dataset.edit));
});

// ---------------------------------------------------------------- router
const VIEWS = ['today', 'week', 'month', 'year', 'wrapped', 'apps'];
function route() {
  const r = (location.hash || '#today').slice(1), view = VIEWS.includes(r) ? r : 'today';
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.hash === '#' + view));
  const p = { wrapped: showWrapped, year: showYear, apps: showApps }[view]?.() ?? showRange(view);
  p.catch(() => $('#view').innerHTML = `<div class="card empty">${T.offline}</div>`);
}
async function init() {
  try { CONF = await getJSON('/api/config'); } catch { CONF = {}; }
  T = I18N[CONF.lang] || I18N[(navigator.language || 'en').slice(0, 2)] || I18N.en;
  document.documentElement.lang = CONF.lang || 'en';
  $('#nav').innerHTML = VIEWS.map(v => `<a href="#${v}">${v === 'wrapped' ? '✨ ' : ''}${T.nav[v]}</a>`).join('');
  $('#foot-local').textContent = T.local;
  $('#foot-export').textContent = T.export;
  $('#foot-version').textContent = 'v' + (CONF.version || '');
  window.addEventListener('hashchange', route);
  route();
  setInterval(() => { if (!document.hidden && !$('#editor').open && !['#wrapped', '#year', '#apps'].includes(location.hash)) route(); }, 60000);
}
init();

// Tooltips
const tip = $('#tip');
document.addEventListener('mousemove', e => {
  const t = e.target.closest('[data-tip]');
  if (!t) { tip.style.opacity = 0; return; }
  tip.textContent = t.dataset.tip;
  tip.style.opacity = 1;
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top = (e.clientY - 38) + 'px';
});
</script>
