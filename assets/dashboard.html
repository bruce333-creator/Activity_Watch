<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ounce</title>
<link rel="icon" href="/favicon.ico">
<style>
/* Manrope (SIL Open Font License), embedded in the exe: works offline. */
@font-face { font-family: "Manrope"; font-style: normal; font-weight: 200 800; font-display: swap;
  src: url(/fonts/manrope-latin.woff2) format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Manrope"; font-style: normal; font-weight: 200 800; font-display: swap;
  src: url(/fonts/manrope-latin-ext.woff2) format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
:root {
  color-scheme: dark;
  --bg: #000; --card: #1c1c1e; --card-2: #2c2c2e; --fill: rgba(255,255,255,.07); --line: rgba(255,255,255,.08);
  --text: #f5f5f7; --text-2: #a1a1a6; --muted: #6e6e73;
  --brand: #bf5af2; --accent: #bf5af2; --accent-2: #8e44ff; --on-accent: #fff;
  --irid: linear-gradient(135deg, #d59bff, #a45cff 55%, #7b3dff); --good: #30d158; --warn: #ffd60a;
  --g1: #d59bff; --g2: #a45cff; --g3: #7b3dff;
  --heat-1: rgba(191,90,242,.28); --heat-2: rgba(191,90,242,.5); --heat-3: rgba(191,90,242,.75); --heat-4: #d59bff;
  --header-bg: rgba(0,0,0,.72); --pill: #3a3a3c; --bar: #e5e5ea; --btn-bg: #f5f5f7; --btn-hover: #fff; --btn-fg: #000;
  --switch-off: #48484a; --tip-bg: rgba(44,44,46,.92); --scroll: #3a3a3c;
  --r-card: 22px; --r-btn: 999px; --r-sm: 10px;
  --font: "Manrope", "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(.22, 1, .36, 1); --spring: cubic-bezier(.34, 1.56, .64, 1);
}
* { box-sizing: border-box; }
html { background: var(--bg); scrollbar-color: var(--scroll) transparent; }
body { margin: 0; color: var(--text); font: 15px/1.5 var(--font); font-feature-settings: "tnum" 0; -webkit-font-smoothing: antialiased; min-height: 100vh; background: var(--bg); }
a { color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

/* Header: translucent, sticky, segmented control */
header { position: sticky; top: 0; z-index: 5; background: var(--header-bg); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid transparent; transition: border-color .3s; }
header.scrolled { border-bottom-color: var(--line); }
header .wrap { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 20px; height: 64px; }
.brand { display: flex; align-items: center; gap: 11px; text-decoration: none; white-space: nowrap; }
.brand b { font-size: 16px; font-weight: 700; letter-spacing: -.02em; }
.brand small { color: var(--muted); font-size: 12.5px; font-weight: 500; }
.logo { width: 30px; height: 30px; flex: none; overflow: visible; }
.logo { border-radius: 7px; animation: bubble-in 1s var(--spring) .1s both; }
.brand:hover .logo { animation: bubble-float 1.6s ease-in-out; }
@keyframes bubble-in { from { transform: scale(.6); opacity: 0; } }
@keyframes bubble-float { 50% { transform: translateY(-2px) scale(1.04); filter: hue-rotate(40deg); } }
@keyframes puff-in { from { transform: scale(.4); opacity: 0; } }
@keyframes grow { from { transform: scaleY(0); } }
@keyframes blow { from { transform: translate(-16px, 12px) rotate(-25deg); opacity: 0; } }
@keyframes drift { 0%, 100% { transform: none; } 50% { transform: translate(3px, -3px) rotate(8deg); } }
nav { position: relative; display: flex; justify-self: center; min-width: 0; padding: 3px; border-radius: 999px; background: var(--card); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav a { position: relative; z-index: 1; color: var(--text-2); text-decoration: none; padding: 6px 15px; border-radius: 999px; font-size: 13.5px; font-weight: 600; white-space: nowrap; transition: color .3s var(--ease); }
nav a:hover { color: var(--text); }
nav a.on { color: var(--text); }
nav .pill { position: absolute; top: 3px; bottom: 3px; left: 0; width: 0; border-radius: 999px; background: var(--pill);
  box-shadow: 0 1px 3px rgba(0,0,0,.4); transition: transform .5s var(--ease), width .5s var(--ease); }
.head-right { justify-self: end; color: var(--muted); font-size: 13px; font-weight: 500; white-space: nowrap; }
@media (max-width: 1100px) { .brand small { display: none; } }
@media (max-width: 860px) {
  header .wrap { grid-template-columns: minmax(0, 1fr); height: auto; padding-top: 12px; padding-bottom: 12px; gap: 10px; }
  nav { justify-self: stretch; } .head-right { display: none; }
}

main { padding-top: 56px; padding-bottom: 64px; }
h1.title { font-size: clamp(34px, 5.4vw, 52px); font-weight: 700; letter-spacing: -.04em; line-height: 1.04; margin: 0 0 8px; }
.lead { color: var(--text-2); margin: 0 0 36px; font-size: 17px; font-weight: 500; letter-spacing: -.01em; }
h2 { font-size: 19px; font-weight: 700; letter-spacing: -.025em; margin: 0 0 4px; }
.hint-line { color: var(--muted); font-size: 13.5px; margin: 0 0 18px; }
.card { background: var(--card); border-radius: var(--r-card); padding: 26px; }
.label { color: var(--text-2); font-size: 13.5px; font-weight: 600; }
.row { display: grid; gap: 14px; margin-bottom: 14px; }
.row > * { min-width: 0; }
.tile .v { overflow-wrap: anywhere; }
.c2 { grid-template-columns: 1.5fr 1fr; } .c3 { grid-template-columns: repeat(3, 1fr); } .c4 { grid-template-columns: repeat(4, 1fr); }
.c2b { grid-template-columns: 1fr 1fr; }
@media (max-width: 860px) { .c2, .c2b, .c3 { grid-template-columns: 1fr; } .c4 { grid-template-columns: 1fr 1fr; } }
section.block { margin-top: 52px; }
.big { font-size: clamp(52px, 8vw, 76px); font-weight: 700; letter-spacing: -.05em; line-height: 1; margin: 14px 0 18px; font-variant-numeric: tabular-nums; }
.big small { font-size: .36em; color: var(--text-2); font-weight: 600; letter-spacing: -.01em; margin: 0 8px 0 3px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--text-2); background: var(--fill); }
.sub { color: var(--text-2); font-size: 14px; margin-top: 14px; }
.sub b { color: var(--text); font-weight: 700; }
.goal { display: flex; align-items: center; gap: 24px; }
.goal svg { flex: none; }
.goal .v { font-size: 28px; font-weight: 700; letter-spacing: -.03em; margin-top: 2px; }
.ring-arc { transition: stroke-dasharray 1.6s var(--ease) .25s; }
.ring text { font-family: var(--font); }
.tile .v { font-size: 30px; font-weight: 700; letter-spacing: -.04em; margin: 10px 0 4px; font-variant-numeric: tabular-nums; }
.tile .hint { color: var(--muted); font-size: 13px; font-weight: 500; }
.tile .hint.warn { color: var(--warn); } .tile .hint.ok { color: var(--good); }

/* Themes: html[data-theme]. "default" is the dark look above. */
html[data-theme=light] {
  color-scheme: light;
  --bg: #f5f5f7; --card: #fff; --card-2: #e8e8ed; --fill: rgba(0,0,0,.045); --line: rgba(0,0,0,.08);
  --text: #1d1d1f; --text-2: #6e6e73; --muted: #8e8e93; --accent: #9b3dd6; --brand: #9b3dd6;
  --header-bg: rgba(245,245,247,.78); --pill: #fff; --bar: #1d1d1f; --btn-bg: #1d1d1f; --btn-hover: #000; --btn-fg: #fff;
  --switch-off: #d1d1d6; --tip-bg: rgba(255,255,255,.96); --scroll: #c7c7cc;
  --heat-1: rgba(155,61,214,.2); --heat-2: rgba(155,61,214,.42); --heat-3: rgba(155,61,214,.68); --heat-4: #8e2fd0;
}
html[data-theme=light] .card, html[data-theme=light] nav { box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.04); }
html[data-theme=light] dialog { box-shadow: 0 30px 80px rgba(0,0,0,.2); }

html[data-theme=terminal] {
  --bg: #030703; --card: #071007; --card-2: #0f220f; --fill: rgba(51,255,102,.07); --line: rgba(51,255,102,.28);
  --text: #4dff7c; --text-2: #2ec85a; --muted: #1f8a3e; --accent: #33ff66; --brand: #33ff66; --on-accent: #021002;
  --irid: #33ff66; --g1: #33ff66; --g2: #33ff66; --g3: #33ff66; --good: #33ff66; --warn: #ffb000;
  --heat-1: #0e4a1c; --heat-2: #16802f; --heat-3: #22c24a; --heat-4: #4dff7c;
  --header-bg: rgba(3,7,3,.92); --pill: #33ff66; --bar: #2ec85a; --btn-bg: transparent; --btn-hover: rgba(51,255,102,.14); --btn-fg: #4dff7c;
  --switch-off: transparent; --tip-bg: #071007; --scroll: #16802f;
  --r-card: 2px; --r-btn: 2px; --r-sm: 0;
  --font: "Courier New", Courier, ui-monospace, monospace;
}
html[data-theme=terminal] * { letter-spacing: 0 !important; }
html[data-theme=terminal] body { text-shadow: 0 0 6px rgba(51,255,102,.35); }
html[data-theme=terminal] body::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 50;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.18) 2px 3px); }
html[data-theme=terminal] .card, html[data-theme=terminal] dialog, html[data-theme=terminal] nav, html[data-theme=terminal] .w-hero { border: 1px solid var(--line); border-radius: 2px; box-shadow: none; }
html[data-theme=terminal] nav .pill, html[data-theme=terminal] nav a, html[data-theme=terminal] .chip,
html[data-theme=terminal] .strip, html[data-theme=terminal] .track, html[data-theme=terminal] .track i, html[data-theme=terminal] .bars .b i,
html[data-theme=terminal] .heat i, html[data-theme=terminal] .scale i, html[data-theme=terminal] .item, html[data-theme=terminal] .avatar,
html[data-theme=terminal] .opt, html[data-theme=terminal] .seg, html[data-theme=terminal] .seg button, html[data-theme=terminal] .themes button,
html[data-theme=terminal] .theme-cards button, html[data-theme=terminal] .taskbar, html[data-theme=terminal] #tip { border-radius: 0; }
html[data-theme=terminal] nav a.on, html[data-theme=terminal] .seg button.on { color: var(--on-accent); text-shadow: none; }
html[data-theme=terminal] h1.title::before { content: '> '; color: var(--muted); }
html[data-theme=terminal] h1.title::after { content: '_'; animation: blink 1s steps(1) infinite; }
html[data-theme=terminal] .card h2::before { content: '# '; color: var(--muted); }
html[data-theme=terminal] .btn { border: 1px solid var(--accent); text-transform: uppercase; }
html[data-theme=terminal] .btn::before { content: '['; } html[data-theme=terminal] .btn::after { content: ']'; }
html[data-theme=terminal] .btn.ghost { border-color: var(--line); background: transparent; }
html[data-theme=terminal] .switch { width: auto; height: auto; background: none; }
html[data-theme=terminal] .switch::after { content: '[ ]'; position: static; display: block; width: auto; height: auto; background: none; box-shadow: none; border-radius: 0; color: var(--text); font-weight: 700; transform: none !important; }
html[data-theme=terminal] .opt input:checked + .switch { background: none; }
html[data-theme=terminal] .opt input:checked + .switch::after { content: '[x]'; transform: none; }
html[data-theme=terminal] .ring-arc { stroke-linecap: butt; }
html[data-theme=terminal] .avatar img, html[data-theme=terminal] .logo { filter: grayscale(1) sepia(1) hue-rotate(70deg) saturate(5) brightness(.95); }
@keyframes blink { 50% { opacity: 0; } }

/* Theme picker */
.theme-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.theme-cards button { border: 2px solid var(--line); border-radius: 14px; padding: 0; overflow: hidden; cursor: pointer; background: none; text-align: left; transition: border-color .2s, transform .2s var(--ease); }
.theme-cards button.on { border-color: var(--accent); } .theme-cards button:active { transform: scale(.97); }
.theme-cards .pv { height: 66px; padding: 10px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; }
.theme-cards .pv i { display: block; height: 6px; border-radius: 3px; }
.theme-cards b { display: block; padding: 8px 10px; font-size: 13px; font-weight: 600; color: var(--text); background: var(--card-2); }
.taskbar.terminal .w b, .taskbar.terminal .w span { font-family: "Courier New", monospace; color: #33ff66; }
.taskbar.terminal .w span { color: #22b24a; }
.taskbar .w .gbar { display: block; height: 2px; margin-top: 3px; background: rgba(255,255,255,.25); }
.taskbar .w .gbar i { display: block; height: 100%; width: 62%; background: #bf5af2; }
.taskbar.terminal .w .gbar i { background: #33ff66; }

/* Charts */
.strip { position: relative; height: 34px; border-radius: 10px; background: var(--card-2); overflow: hidden; margin: 16px 0 6px; }
.strip i { position: absolute; top: 0; bottom: 0; border-right: 1.5px solid var(--card); min-width: 2px; transition: filter .2s; }
.strip i:hover { filter: brightness(1.25); }
.ticks { position: relative; height: 18px; color: var(--muted); font-size: 11.5px; font-weight: 600; margin-bottom: 14px; }
.ticks span { position: absolute; transform: translateX(-50%); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--text-2); font-size: 13px; font-weight: 500; margin-bottom: 30px; }
.legend b { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; }
.bars { display: flex; align-items: flex-end; gap: 5px; height: 170px; position: relative; margin-top: 18px; }
.bars .b { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; min-width: 0; }
.bars .b i { display: block; width: 100%; max-width: 30px; border-radius: 6px 6px 3px 3px; background: var(--bar); min-height: 3px; transform-origin: bottom; transition: background .25s, opacity .25s; }
.bars .b.zero i { background: var(--card-2); }
.bars .b.now i { background: var(--irid); }
.bars .b.over i { background: var(--warn); }
.bars:hover .b i { opacity: .45; }
.bars .b:hover i { opacity: 1; }
.bars.goal { padding-right: 58px; }
.bars .goal-line { position: absolute; left: 0; right: 0; border-top: 1px dashed rgba(255,159,10,.55); pointer-events: none; }
.bars .goal-line span { position: absolute; right: 0; top: -9px; font-size: 11px; font-weight: 600; line-height: 16px; color: var(--warn); background: var(--card); padding-left: 8px; }
.xl.goal { padding-right: 58px; }
.xl { display: flex; gap: 5px; margin-top: 10px; color: var(--muted); font-size: 11.5px; font-weight: 600; }
.xl span { flex: 1; text-align: center; min-width: 0; white-space: nowrap; }

/* Lists */
.list { display: flex; flex-direction: column; margin: 0 -10px; }
.item { display: grid; grid-template-columns: 36px 1fr auto; gap: 14px; align-items: center; padding: 11px 10px; border-radius: 14px; transition: background .25s; }
.item:hover { background: var(--fill); }
.item .name { font-weight: 600; display: flex; justify-content: space-between; gap: 10px; letter-spacing: -.01em; }
.item .name em { font-style: normal; color: var(--muted); font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track { height: 5px; background: var(--card-2); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 3px; background: var(--bar); transform-origin: left; }
.track.limit i { background: var(--irid); } .track.limit.over i { background: var(--warn); }
.item .t { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 80px; letter-spacing: -.01em; }
.item .t small { display: block; font-weight: 500; font-size: 12.5px; color: var(--muted); }
.avatar { position: relative; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 15px; }
.avatar img { position: absolute; width: 32px; height: 32px; }
.empty { color: var(--muted); text-align: center; padding: 32px 0; font-weight: 500; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 20px; border-radius: var(--r-btn); font: 600 14px var(--font); cursor: pointer; text-decoration: none;
  background: var(--btn-bg); color: var(--btn-fg); border: 0; transition: transform .2s var(--ease), background .2s, opacity .2s; }
.btn:hover { background: var(--btn-hover); }
.btn:active { transform: scale(.96); }
.btn.ghost { background: var(--fill); color: var(--text); }
.btn.ghost:hover { background: var(--line); }
.btn:disabled { opacity: .3; cursor: default; transform: none; }
.btn.small { padding: 7px 14px; font-size: 13px; }
#tip { position: fixed; pointer-events: none; background: var(--tip-bg); backdrop-filter: blur(12px); color: var(--text); font-size: 12.5px; font-weight: 600;
  padding: 7px 11px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.5); opacity: 0; transform: translateY(4px); z-index: 10; white-space: nowrap;
  transition: opacity .18s, transform .18s var(--ease); }
#tip.on { opacity: 1; transform: none; }

/* Year */
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; overflow-x: auto; padding-bottom: 4px; }
.heat i { width: 13px; height: 13px; border-radius: 4px; background: var(--card-2); transition: transform .2s var(--ease); }
.heat i:hover { transform: scale(1.35); }
.heat i.l1 { background: var(--heat-1); } .heat i.l2 { background: var(--heat-2); } .heat i.l3 { background: var(--heat-3); } .heat i.l4 { background: var(--heat-4); }
.heat i.future { background: transparent; }
.months { display: grid; grid-auto-flow: column; gap: 3px; color: var(--muted); font-size: 11.5px; font-weight: 600; margin-bottom: 8px; overflow: hidden; }
.months span { width: 13px; white-space: nowrap; }
.scale { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; font-weight: 500; margin-top: 14px; justify-content: flex-end; }
.scale i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.streak .v { font-size: 46px; font-weight: 700; letter-spacing: -.05em; margin: 8px 0 0; }

/* Wrapped */
.w-nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
.w-nav b { font-weight: 700; letter-spacing: -.01em; }
.w-hero { position: relative; overflow: hidden; border-radius: 28px; padding: 56px 44px 52px; margin-bottom: 14px; background: var(--card); }
.w-hero .emoji { display: inline-block; font-size: 72px; line-height: 1; margin: 26px 0 18px; }
.w-hero .emoji span { display: inline-block; }
.w-hero h1 { font-size: clamp(44px, 7.5vw, 84px); font-weight: 800; letter-spacing: -.055em; line-height: .98; margin: 0; }
.w-hero h1 .w { display: inline-block; white-space: nowrap; }
.w-hero h1 .w span { display: inline-block; }
.w-hero p { font-size: 19px; font-weight: 500; color: var(--text-2); margin: 16px 0 0; max-width: 620px; letter-spacing: -.01em; }
.stat .v { font-size: 38px; font-weight: 700; letter-spacing: -.05em; margin: 10px 0 8px; }
.top1 { display: flex; align-items: center; gap: 16px; margin-top: 14px; }
.top1 .avatar { width: 60px; height: 60px; border-radius: 16px; font-size: 24px; }
.top1 .avatar img { width: 52px; height: 52px; }
.move { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.move .d { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }

/* Customization */
.edit { opacity: 0; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; padding: 2px 7px; border-radius: 8px; transition: opacity .2s, color .2s, background .2s; }
.item:hover .edit, .edit:focus-visible { opacity: 1; } .edit:hover { color: var(--text); background: var(--fill); }
@media (hover: none) { .edit { opacity: 1; } }
.name .nm { display: inline-flex; align-items: center; gap: 4px; min-width: 0; }
dialog { background: var(--card); color: var(--text); border: 0; border-radius: 24px; padding: 30px; width: min(450px, calc(100vw - 32px)); box-shadow: 0 30px 80px rgba(0,0,0,.6); }
dialog[open] { animation: sheet .45s var(--ease); }
dialog.wide { width: min(980px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
#welcome { width: min(520px, calc(100vw - 32px)); padding: 34px; }
#welcome .mark { width: 64px; height: 64px; display: block; margin-bottom: 18px; }
#welcome h2 { font-size: 28px; letter-spacing: -.02em; }
.opt { display: flex; gap: 16px; align-items: center; justify-content: space-between; background: var(--card-2); border-radius: 16px; padding: 16px 18px; margin-top: 12px; cursor: pointer; }
.opt b { display: block; font-size: 15px; } .opt span { color: var(--text-2); font-size: 13px; }
.switch { position: relative; flex: none; width: 50px; height: 30px; border-radius: 999px; background: var(--switch-off); transition: background .25s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); transition: transform .3s var(--spring); }

let T = I18N.en, CONF = {};

// ---------------------------------------------------------------- helpers
const PALETTES = {
  default: ['#0a84ff', '#ff9f0a', '#30d158', '#bf5af2', '#ff375f', '#64d2ff', '#ffd60a', '#5e5ce6'],
  terminal: ['#33ff66', '#ffb000', '#00e5ff', '#ff5f56', '#b3ff00', '#ff79c6', '#d0d0d0', '#7aa2ff'],
};
let PALETTE = PALETTES.default;
// Themes: the page look (CSS html[data-theme]) and the taskbar widget's style.
const THEME_IDS = ['default', 'light', 'terminal'];
const THEME_PV = { default: ['#000', '#1c1c1e', '#bf5af2', '#f5f5f7'], light: ['#f5f5f7', '#fff', '#9b3dd6', '#1d1d1f'], terminal: ['#030703', '#071007', '#33ff66', '#2ec85a'] };
function applyTheme(t) {

  document.documentElement.dataset.theme = t;
  PALETTE = PALETTES[t] || PALETTES.default;
  try { localStorage.setItem('theme', t); } catch {}
}
try { applyTheme(localStorage.getItem('theme') || 'default'); } catch {}
function themeCards(current, names) {
  return `<div class="theme-cards">${THEME_IDS.map(t => { const [bg, card, acc, text] = THEME_PV[t];
    return `<button type="button" data-theme-pick="${t}" class="${t === current ? 'on' : ''}"><div class="pv" style="background:${bg}">
      <i style="background:${acc};width:55%"></i><i style="background:${text};width:80%;opacity:.8"></i><i style="background:${card === '#fff' ? '#e8e8ed' : card};width:65%;outline:1px solid ${acc}33"></i></div>
      <b style="${t === 'terminal' ? 'font-family:Courier New,monospace' : ''}">${names[t]}</b></button>`; }).join('')}</div>`;
}
// Taskbar preview, in the widget's style for the theme.
function taskbarPreview(on, theme, line, bar) {

  return `<div class="taskbar ${on ? 'on' : ''} ${theme === 'terminal' ? 'terminal' : ''}" id="wl-preview"><div class="w"><b>${theme === 'terminal' ? '&gt; ' : ''}2 h 14</b>${l2 ? `<span>${l2}</span>` : ''}${bar ? '<span class="gbar"><i></i></span>' : ''}</div><div class="clock">14:32<br>24/11/2026</div></div>`;
}
async function savePrefs(p) {

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(s) {
  s = Math.round(Math.abs(s || 0));
  if (s < 60) return s > 0 ? T.lessThanMin : `0 ${T.min}`;
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h}\u00a0h\u00a0${String(m).padStart(2, "0")}` : `${m}\u00a0${T.min}`;
}
function fmtBig(s) {
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h}<small>h</small>${String(m).padStart(2, '0')}<small>${T.min}</small>` : `${m}<small>${T.min}</small>`;
}
// Numbers that count up when a view opens. kind: big | dur | int | days
const RENDER = { big: v => fmtBig(v), dur: v => fmt(v), int: v => String(Math.round(v)), days: v => T.days(Math.round(v)) };
const num = (value, kind) => `<span data-count="${value}" data-kind="${kind}">${RENDER[kind](value)}</span>`;
function countUp(root) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  root.querySelectorAll('[data-count]').forEach((el, n) => {
    const to = +el.dataset.count, kind = el.dataset.kind, t0 = performance.now() + 150 + n * 40, dur = 1300;
    el.innerHTML = RENDER[kind](0);
    const step = now => {
      const p = Math.min(1, Math.max(0, (now - t0) / dur)), e = 1 - Math.pow(1 - p, 4);
      el.innerHTML = RENDER[kind](to * e);
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
const clock = t => t == null ? '–' : `${String(Math.floor(t / 3600) % 24).padStart(2, '0')}:${String(Math.floor(t % 3600 / 60)).padStart(2, '0')}`;
const day = (label, opts) => new Date(label + 'T12:00').toLocaleDateString(T.locale, opts);
let colors = {}, ICON_V = Date.now();
function setColors(names) { colors = {}; names.forEach((n, i) => colors[n] = PALETTE[i % PALETTE.length]); }
const color = name => colors[name] || '#555';
function avatar(a) {
  // The app's real icon when available, its initial otherwise.
  return `<div class="avatar" style="background:${color(a.name)}"><img src="/icon/${encodeURIComponent(a.process)}?v=${ICON_V}" alt=""
    onload="this.parentNode.style.background='transparent';this.nextSibling.remove()" onerror="this.remove()"><span>${esc((a.name[0] || '?').toUpperCase())}</span></div>`;
}
function delta(cur, prev, what) {
  if (!prev) return `<span class="chip">${T.noCompare}</span>`;
  const p = Math.round(100 * (cur - prev) / prev);

}
function change(a) {

}

  return `<svg class="ring" width="120" height="120" viewBox="0 0 116 116" aria-hidden="true">
    <defs><linearGradient id="irid" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--g1)"/><stop offset=".5" style="stop-color:var(--g2)"/><stop offset="1" style="stop-color:var(--g3)"/></linearGradient></defs>
    <circle cx="58" cy="58" r="${r}" fill="none" style="stroke:var(--card-2)" stroke-width="11"/>
    <circle class="ring-arc" cx="58" cy="58" r="${r}" fill="none" stroke="${over ? '#ffd60a' : 'url(#irid)'}" stroke-width="11" stroke-linecap="round"
      data-dash="${c * f} ${c}" stroke-dasharray="${c * f} ${c}" transform="rotate(-90 58 58)"/>

// Bars with hover tooltips. items: [{label, tip, value, now}]
function bars(items, goal) {

    <i style="height:${Math.max(1.5, 100 * i.value / max)}%"></i></div>`).join('')}</div>

function appList(apps, total) {

  const max = shown[0].seconds;

    <div><div class="name"><span class="nm">${esc(a.name)}${editBtn(a)}</span><em>${total ? Math.round(100 * a.seconds / total) : 0} %</em></div>

const editBtn = a => `<button class="edit" title="${esc(T.edit)}" data-edit="${esc(JSON.stringify({ key: a.key, name: a.name, process: a.process }))}">✎</button>`;

// Shows a view. With `animate`, cards rise in one after the other, numbers count up,
// rings draw and bars grow; the automatic refresh passes false so nothing moves.
function render(html, animate) {
  const v = $('#view');
  v.classList.toggle('anim', animate && !matchMedia('(prefers-reduced-motion: reduce)').matches);
  v.innerHTML = html;
  if (!animate) return;
  v.querySelectorAll('h1.title, .lead, .card, section.block > h2, section.block > .hint-line, .w-nav, .w-hero')
    .forEach((el, i) => { el.classList.add('rv'); el.style.setProperty('--i', i); });
  v.querySelectorAll('.heat i').forEach((el, i) => el.style.setProperty('--c', Math.floor(i / 7)));
  countUp(v);
  v.querySelectorAll('.ring-arc').forEach(el => {

// ---------------------------------------------------------------- today / week / month
async function showRange(range, animate) {
  const d = await getJSON('/api/summary?range=' + range);
  setColors(d.apps.map(a => a.name));
  const today = range === 'today', w = d.wellbeing, f = d.focus;
  $('#period').textContent = today ? day(d.from, { weekday: 'long', day: 'numeric', month: 'long' })
    : `${day(d.from, { day: 'numeric', month: 'short' })} – ${day(d.to, { day: 'numeric', month: 'short' })}`;

  const goalText = !d.goal ? T.noGoal : ringVal > d.goal ? T.goalOver(fmt(d.goal), fmt(ringVal - d.goal)) : T.goalLeft(fmt(d.goal), fmt(d.goal - ringVal));

      <div class="strip">${segs.map(s => `<i data-tip="${esc(s.name)} · ${clock(s.start)}–${clock(s.end)} · ${fmt(s.end - s.start)}"
        style="left:${x(s.start)}%;width:${x(s.end) - x(s.start)}%;background:${color(s.name)}"></i>`).join('')}</div>
      <div class="ticks">${ticks.map(h => `<span style="left:${x(h * 3600)}%">${h % 24}h</span>`).join('')}</div>

  } else {

  }

  <h1 class="title">${T.titles[range]}</h1><p class="lead">${T.lead[range]}</p>
  <div class="row c2">
    <div class="card"><div class="label">${T.screen}</div><div class="big">${num(d.total, 'big')}</div>${delta(d.total, d.previous_total, T.vs[range])}

}

// Focus mode: a 25 or 50 min session; break reminders and limits wait until it ends.
function focusCard() {
  const left = CONF.focus_end ? CONF.focus_end - Date.now() / 1000 : 0;
  return `<div class="card focuscard" style="margin-bottom:12px"><div><div class="label">${T.focusMode}</div>

  CONF.focus_end = minutes ? Math.floor(Date.now() / 1000) + minutes * 60 : null;
  route(false);
});
setInterval(() => {
  const el = $('#focus-left'); if (!el || !CONF.focus_end) return;
  const left = CONF.focus_end - Date.now() / 1000;
  if (left > 0) el.textContent = mmss(left); else { CONF.focus_end = null; route(false); }

// ---------------------------------------------------------------- year
async function showYear(animate) {
  const y = await getJSON('/api/year');
  $('#period').textContent = T.yearTotal;
  const max = Math.max(...y.days, 1), q = s => !s ? 0 : s < max * .25 ? 1 : s < max * .5 ? 2 : s < max * .75 ? 3 : 4;

// Crumpled paper: faceted planes and sharp creases, lit from the top left; uneven thermal ink.
function crumple(p, w, h, rnd) {
  const img = p.getImageData(0, 0, w, h), d = img.data;
  const creases = Array.from({ length: 14 }, () => {
    const a = rnd() * Math.PI, len = 90 + rnd() * 320;
    return { px: rnd() * w, py: rnd() * h, nx: -Math.sin(a), ny: Math.cos(a), tx: Math.cos(a), ty: Math.sin(a),
      tilt: (rnd() - .5) * .22, sharp: .3 + rnd() * .6, len };
  });
  const band = Array.from({ length: Math.ceil(h / 24) + 1 }, () => rnd());
  for (let y = 0; y < h; y++) {
    const fade = .12 + .3 * band[y / 24 | 0] * band[(y / 24 | 0) + 1];
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      if (!d[i + 3]) continue;
      let s = -.06 * x / w + .03 * Math.sin(y / h * Math.PI);
      for (const c of creases) {
        const dx = x - c.px, dy = y - c.py, dn = dx * c.nx + dy * c.ny, dt = dx * c.tx + dy * c.ty;
        const along = Math.exp(-(dt * dt) / (c.len * c.len));
        s += along * (c.tilt * Math.tanh(dn / 40) + c.sharp * (-.12 * Math.exp(-dn * dn / 3) + .07 * Math.exp(-(dn - 3) * (dn - 3) / 8)));
      }
      s += (rnd() - .5) * .035;
      const lum = d[i] + d[i + 1] + d[i + 2];
      const ink = lum < 450 ? fade : 0;
      for (let k = 0; k < 3; k++) d[i + k] = Math.max(0, Math.min(255, (d[i + k] + (246 - d[i + k]) * ink) * (1 + s)));
    }
  }
  p.putImageData(img, 0, 0);
}

  for (let i = 0; i < d.length; i += 4) { const n = (rnd() - .5) * 255 * grain; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(img, 0, 0);
}

// Any image (PNG, JPG, SVG, ICO, WebP…) becomes a 128x128 PNG, centered and uncropped.
function toLogoPng(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const S = 128, c = document.createElement('canvas'); c.width = c.height = S;
      const w = img.naturalWidth || S, h = img.naturalHeight || S, k = S / Math.max(w, h);
      c.getContext('2d').drawImage(img, (S - w * k) / 2, (S - h * k) / 2, w * k, h * k);
      c.toBlob(b => b ? resolve(b) : reject(), 'image/png');
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

    const name = $('#ed-name').value.trim();
    if (name !== editing.name) await send('/api/apps/rename', { method: 'POST', headers: { ...WRITE, 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: editing.key, name: name === editing.key ? '' : name }) });
    const iconUrl = '/api/apps/icon?key=' + encodeURIComponent(editing.key);
    if (newLogo) await send(iconUrl, { method: 'POST', headers: { ...WRITE, 'Content-Type': 'image/png' }, body: newLogo });
    else if (resetLogo) await send(iconUrl, { method: 'DELETE', headers: WRITE });

  } catch (err) { $('#ed-err').textContent = T.saveError + err.message; }

  const sw = (key, [title, hint]) => `<label class="opt"><div><b>${title}</b><span>${hint}</span></div><input type="checkbox" data-k="${key}" ${SETUP[key] ? 'checked' : ''}><i class="switch"></i></label>`;
  const row = ([title, hint], control) => `<div class="opt static"><div><b>${title}</b><span>${hint}</span></div>${control}</div>`;
  document.querySelectorAll('#welcome .steps i').forEach((d, i) => d.classList.toggle('on', i <= st));
  $('#wl-body').innerHTML = [
    `<img class="mark" src="/logo.png" alt=""><h2>${W.title}</h2><p class="hint-line" style="margin:6px 0 10px">${W.lead}</p>
     ${row(W.lang, seg('lang', [['en', 'English'], ['fr', 'Français']]))}
     <div class="opt static" style="display:block"><div><b>${W.theme[0]}</b><span>${W.theme[1]}</span></div>${themeCards(SETUP.theme, I18N[SETUP.lang].prefs.themes)}</div>`,
    `<h2>${W.rhythm}</h2><p class="hint-line" style="margin:6px 0 10px">${W.rhythmLead}</p>
     ${row(W.goal, seg('goal', [[4, '4 h'], [6, '6 h'], [8, '8 h'], [10, '10 h']]))}
     ${row(W.reminder, seg('reminder', [[0, W.never], [45, '45 min'], [60, '1 h'], [90, '1 h 30']]))}
     ${sw('notifications', W.notifications)}`,
    `<h2>${W.options}</h2><p class="hint-line" style="margin:6px 0 10px">${W.optionsLead}</p>
     ${sw('widget', W.widget)}
     ${taskbarPreview(SETUP.widget, SETUP.theme, 'app', true)}
     ${sw('autostart', W.autostart)}${sw('versions', W.versions)}${sw('render', W.render)}${sw('updates', W.updates)}`,
  ][st];
  $('#wl-back').textContent = W.back; $('#wl-back').style.visibility = st ? 'visible' : 'hidden';
  $('#wl-go').textContent = st < 2 ? W.next : W.done;
}
$('#wl-body').addEventListener('click', e => {
  const t = e.target.closest('[data-theme-pick]');
  if (t) { SETUP.theme = t.dataset.themePick; applyTheme(SETUP.theme); drawWelcome(); return; }
  const b = e.target.closest('.seg button'); if (!b) return;
  SETUP[b.dataset.k] = b.dataset.k === 'lang' ? b.dataset.v : +b.dataset.v;
  drawWelcome();
});
$('#wl-body').addEventListener('change', e => {
  if (!e.target.dataset.k) return;
  SETUP[e.target.dataset.k] = e.target.checked;
  if (e.target.dataset.k === 'widget') $('#wl-preview').classList.toggle('on', e.target.checked);
});
$('#welcome').addEventListener('cancel', e => e.preventDefault());
$('#wl-back').onclick = () => { SETUP.step--; drawWelcome(); };
$('#wl-go').onclick = async () => {
  if (SETUP.step < 2) { SETUP.step++; drawWelcome(); return; }
  const go = $('#wl-go'); go.disabled = true;
  let answer = '';
  try {
    answer = await (await fetch('/api/onboarding', { method: 'POST', headers: { ...WRITE, 'Content-Type': 'application/json' },
      body: JSON.stringify({ lang: SETUP.lang, goal_hours: SETUP.goal, break_reminder_minutes: SETUP.reminder,
        notifications: SETUP.notifications, widget: SETUP.widget, autostart: SETUP.autostart,
        render_time: SETUP.render, group_versions: SETUP.versions, check_updates: SETUP.updates, theme: SETUP.theme }) })).text();
  } catch {}
  CONF.onboarding = false;
  if (answer !== 'restart') { go.disabled = false; $('#welcome').close(); return; }
  // Ounce restarts with the new settings: wait for it, then reload in the chosen language.
  go.textContent = I18N[SETUP.lang].setup.applying;
  for (let i = 0; i < 40; i++) {
    await new Promise(r => setTimeout(r, 500));
    try { const c = await getJSON('/api/config'); if (c.lang === SETUP.lang && i > 2) break; } catch {}
  }
  location.reload();
};

// Update banner: the tracker downloads the new exe, swaps it and restarts; the page then reloads.
function showUpdate() {
  const box = $('#update'), btn = $('#update-btn');
  if (!CONF.update || box.dataset.busy) { box.hidden = !box.dataset.busy; return; }
  $('#update-text').innerHTML = T.update(esc(CONF.update));
  btn.textContent = T.updateBtn;
  btn.disabled = false;
  box.hidden = false;
}
$('#update-btn').onclick = async () => {
  const box = $('#update'), btn = $('#update-btn'), from = CONF.version;
  box.dataset.busy = '1';
  btn.disabled = true;
  $('#update-text').textContent = T.updating;
  try {
    const r = await fetch('/api/update', { method: 'POST', headers: WRITE });
    if (!r.ok) throw 0;
  } catch { delete box.dataset.busy; $('#update-text').textContent = T.updateFail; return; }
  // Wait for the new version to answer (download + restart), then reload.
  for (let i = 0; i < 90; i++) {
    await new Promise(r => setTimeout(r, 2000));
    try { if ((await getJSON('/api/config')).version !== from) return location.reload(); } catch {}
  }
  delete box.dataset.busy;
  $('#update-text').textContent = T.updateFail;
  btn.disabled = false;
};
setInterval(async () => { try { CONF = await getJSON('/api/config'); showUpdate(); } catch {} }, 600000);

// Tooltips
const tip = $('#tip');
document.addEventListener('mousemove', e => {
  const t = e.target.closest('[data-tip]');
  if (!t) { tip.classList.remove('on'); return; }
  tip.textContent = t.dataset.tip;
  tip.classList.add('on');
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top = (e.clientY - 38) + 'px';
});
</script>
</body>
</html>
