name: build

on:
  push:            # every branch, and tags (v* tags also publish a Release)
  workflow_dispatch:

permissions:
  contents: write  # needed to attach the .exe to a Release

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Set once SignPath Foundation has accepted the project (see README, "Signer l'exe").
      # Without it, releases are published unsigned.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # The app compares the Release tag to its own version: they must match, or the
      # installed exe would keep seeing itself as outdated.
      - name: Tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { Write-Error "tag ${{ github.ref_name }} != Cargo.toml version $v"; exit 1 }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Selftest (15 s)
        shell: pwsh
        run: |
          # The release exe is a GUI-subsystem app: redirect its output to files, then print them.
          $p = Start-Process -FilePath target\release\activity-tracker.exe -ArgumentList '--selftest' `
                 -Wait -PassThru -NoNewWindow `
                 -RedirectStandardOutput selftest.txt -RedirectStandardError selftest-err.txt
          Get-Content selftest.txt
          Get-Content selftest-err.txt
          "exe size: {0:N0} bytes" -f (Get-Item target\release\activity-tracker.exe).Length
          if ($p.ExitCode -ne 0) { Write-Error "selftest exit code $($p.ExitCode)"; exit 1 }

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: activity-tracker
          path: target/release/activity-tracker.exe

      - name: Sign with SignPath
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'activity-tracker' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          # Release signing is approved by hand on signpath.io: leave time for it.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Use the signed exe
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature signed\activity-tracker.exe
          "signature: $($sig.Status) / $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { Write-Error "signed exe is not valid"; exit 1 }
          Copy-Item signed\activity-tracker.exe target\release\activity-tracker.exe -Force

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/activity-tracker.exe
          generate_release_notes: true
