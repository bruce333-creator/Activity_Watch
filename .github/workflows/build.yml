name: build

on:
  push:            # every branch, and tags (v* tags also publish a Release)
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a Release (tag v<Cargo.toml version>) from this commit"
        type: boolean
        default: false

permissions:
  contents: write  # needed to attach the .exe to a Release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      # The app compares the Release tag to its own version: they must match, or the
      # installed exe would keep seeing itself as outdated.
      - name: Tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { Write-Error "tag ${{ github.ref_name }} != Cargo.toml version $v"; exit 1 }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Selftest (15 s)
        shell: pwsh
        run: |
          # The release exe is a GUI-subsystem app: redirect its output to files, then print them.
          $p = Start-Process -FilePath target\release\ounce.exe -ArgumentList '--selftest' `
                 -Wait -PassThru -NoNewWindow `
                 -RedirectStandardOutput selftest.txt -RedirectStandardError selftest-err.txt
          Get-Content selftest.txt
          Get-Content selftest-err.txt
          "exe size: {0:N0} bytes" -f (Get-Item target\release\ounce.exe).Length
          if ($p.ExitCode -ne 0) { Write-Error "selftest exit code $($p.ExitCode)"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: ounce
          path: target/release/ounce.exe

      # Microsoft Store package. Upload ounce.msix in Partner Center: the Store signs it.
      # Set the repository variables MSIX_IDENTITY_NAME, MSIX_PUBLISHER and
      # MSIX_PUBLISHER_DISPLAY_NAME to the values of Partner Center > Product identity.
      - name: Store package (MSIX) + install test
        shell: pwsh
        env:
          MSIX_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'EnzoFreminet.Ounce' }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=Enzo Freminet' }}
          MSIX_PUBLISHER_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'Enzo Freminet' }}
        run: |
          $sdk = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\makeappx.exe" | Sort-Object FullName | Select-Object -Last 1).DirectoryName
          "Windows SDK tools: $sdk"
          New-Item -ItemType Directory msix\Assets -Force | Out-Null
          Copy-Item target\release\ounce.exe msix\
          Copy-Item packaging\Assets\* msix\Assets\
          (Get-Content packaging\AppxManifest.xml -Raw).Replace('{{NAME}}', $env:MSIX_NAME).Replace('{{PUBLISHER}}', $env:MSIX_PUBLISHER).Replace('{{PUBLISHER_NAME}}', $env:MSIX_PUBLISHER_NAME).Replace('{{VERSION}}', "${{ steps.ver.outputs.version }}.0") |
            Set-Content msix\AppxManifest.xml -Encoding utf8
          & "$sdk\makeappx.exe" pack /d msix /p ounce.msix /o
          if ($LASTEXITCODE) { exit 1 }

          # Test: sign a copy with a throwaway certificate, install it, run the packaged selftest.
          Copy-Item ounce.msix test.msix
          $cert = New-SelfSignedCertificate -Type Custom -Subject $env:MSIX_PUBLISHER -KeyUsage DigitalSignature `
                    -CertStoreLocation Cert:\CurrentUser\My -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          & "$sdk\signtool.exe" sign /fd SHA256 /sha1 $cert.Thumbprint test.msix
          if ($LASTEXITCODE) { exit 1 }
          Export-Certificate -Cert $cert -FilePath test.cer | Out-Null
          Import-Certificate -FilePath test.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Add-AppxPackage test.msix
          $p = Start-Process -FilePath "$env:LOCALAPPDATA\Microsoft\WindowsApps\ounce.exe" -ArgumentList '--selftest' `
                 -Wait -PassThru -NoNewWindow -RedirectStandardOutput msix-selftest.txt -RedirectStandardError msix-selftest-err.txt
          Get-Content msix-selftest.txt
          Get-Content msix-selftest-err.txt
          if ($p.ExitCode -ne 0) { Write-Error "packaged selftest exit code $($p.ExitCode)"; exit 1 }
          if (-not (Select-String -Path msix-selftest.txt -Pattern 'Store package +: yes.*startup task Some')) { Write-Error "not running as a package"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: ounce-store
          path: ounce.msix

      # A downloaded exe installs itself on double-click, and uninstalls from Settings > Apps.
      - name: Self-install + uninstall test
        shell: pwsh
        run: |
          $dl = "$env:RUNNER_TEMP\Downloads"
          New-Item -ItemType Directory $dl -Force | Out-Null
          Copy-Item target\release\ounce.exe $dl\ounce.exe
          Start-Process "$dl\ounce.exe"
          Start-Sleep 12
          $inst = "$env:LOCALAPPDATA\Programs\Ounce\ounce.exe"
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Ounce'
          $running = @(Get-Process ounce -ErrorAction SilentlyContinue | ForEach-Object Path)
          "installed: $(Test-Path $inst); running: $running"
          "Start menu: $(Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Ounce.lnk")"
          Get-ItemProperty $key | Select-Object DisplayName, DisplayVersion, UninstallString | Format-List
          if (-not (Test-Path $inst)) { Write-Error "not installed"; exit 1 }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Ounce.lnk")) { Write-Error "no Start menu shortcut"; exit 1 }
          if ((Get-ItemProperty $key).DisplayVersion -ne '${{ steps.ver.outputs.version }}') { Write-Error "no Settings > Apps entry"; exit 1 }
          if ($running -notcontains $inst) { Write-Error "the installed copy is not running"; exit 1 }
          if (Get-Item $inst -Stream Zone.Identifier -ErrorAction SilentlyContinue) { Write-Error "installed copy marked as downloaded"; exit 1 }
          Start-Process $inst -ArgumentList '--uninstall', '--quiet' -Wait
          Start-Sleep 6
          "after uninstall: installed $(Test-Path $inst), key $(Test-Path $key), running $(@(Get-Process ounce -ErrorAction SilentlyContinue).Count)"
          if ((Test-Path $inst) -or (Test-Path $key) -or (Get-Process ounce -ErrorAction SilentlyContinue)) { Write-Error "uninstall incomplete"; exit 1 }

      # Versions up to 0.5 look for activity-tracker.exe when they update: publish both names.
      - name: Legacy update name
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        shell: pwsh
        run: Copy-Item target\release\ounce.exe target\release\activity-tracker.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          # On a manual run the tag is created on this commit.
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Ounce ${{ steps.ver.outputs.version }}
          files: |
            target/release/ounce.exe
            target/release/activity-tracker.exe
          generate_release_notes: true
          body: |
            **Download `ounce.exe` below**, put it in a folder of your own and double-click it.
            (`activity-tracker.exe` is the same file, for the automatic update of versions 0.5 and older.)
            Already installed? Click the update notification, or right-click the tray icon → *Install update*.

            Screen time that weighs an ounce. Windows 10/11 · one ~2 MB exe, no installer · your data stays on your PC.
            If Windows SmartScreen warns on first launch: *More info* → *Run anyway*.
